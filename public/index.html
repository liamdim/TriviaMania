<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TriviaMania - Host Dashboard</title>
    <style>
        :root { --bg: #0b0b10; --card: #15151c; --primary: #bb86fc; --accent: #03dac6; --text: #ffffff; --danger: #cf6679; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a35; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; color: var(--primary); }
        .nav-links a { color: var(--accent); text-decoration: none; margin-left: 15px; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
        .panel { background: var(--card); border: 1px solid #2a2a35; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        h2 { font-size: 18px; margin-top: 0; border-bottom: 1px solid #2a2a35; padding-bottom: 10px; color: var(--primary); }
        
        button { padding: 12px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #2a2a35; color: white; width: 100%; margin-top: 10px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-play { background: #4caf50; }
        .btn-reveal { background: #03dac6; color: black; }
        .btn-restart { background: #ff9800; color: black; }
        .btn-danger { background: var(--danger); width: auto; padding: 6px 10px; margin-top: 0; font-size: 12px; }
        .btn-api { background: var(--primary); color: black; font-size: 15px; }

        .playlist-card { background: #22222e; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
        
        select { width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #22222e; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 12px; color: #aaa; }
    </style>
    <script src="/js/api.js"></script>
</head>
<body>

    <header>
        <h1>TriviaMania Host Dashboard</h1>
        <div class="nav-links">
            <a href="/display.html" target="_blank">Open Projector Display</a>
            <a href="/player.html" target="_blank">Player Join Link</a>
        </div>
    </header>

    <div class="grid">
        <!-- Left Column: Master Controls & Players -->
        <div>
            <div class="panel">
                <h2>Master Game Controls</h2>
                <button class="btn-play" onclick="sendAction('resume')">▶ Start / Resume Round</button>
                <button onclick="sendAction('pause')">⏸ Pause Game</button>
                <button class="btn-restart" onclick="sendAction('restart')">🔄 Restart Round</button>
                <button class="btn-reveal" onclick="sendAction('reveal')">💡 Reveal Answer Now</button>
            </div>

            <div class="panel">
                <h2>Connected Players (<span id="playerCount">0</span>)</h2>
                <div id="playerList" style="max-height: 200px; overflow-y: auto;">
                    <p style="color: #777; font-size: 14px;">No players connected yet.</p>
                </div>
            </div>
        </div>

        <!-- Right Column: Playlist & Round Generator -->
        <div>
            <div class="panel">
                <h2>Build Your Quiz Playlist</h2>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label>Question Count:</label>
                        <select id="questionCountSelect">
                            <option value="5">5 Questions</option>
                            <option value="10" selected>10 Questions</option>
                            <option value="15">15 Questions</option>
                            <option value="20">20 Questions</option>
                        </select>
                    </div>
                    <div>
                        <label>Question Timer:</label>
                        <select id="timerSelect">
                            <option value="5">5 Seconds</option>
                            <option value="10" selected>10 Seconds</option>
                            <option value="20">20 Seconds</option>
                            <option value="30">30 Seconds</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label>Delay Before Next Question:</label>
                    <select id="delaySelect">
                        <option value="2">2 Seconds</option>
                        <option value="5" selected>5 Seconds</option>
                        <option value="10">10 Seconds</option>
                        <option value="15">15 Seconds</option>
                    </select>
                </div>

                <hr style="border: 0; border-top: 1px solid #2a2a35; margin: 15px 0;">

                <!-- 1. Standard Trivia Section -->
                <label>Standard Trivia Category:</label>
                <select id="categorySelect">
                    <option value="">Random / General Knowledge</option>
                    <option value="9">General Knowledge</option>
                    <option value="17">Science & Nature</option>
                    <option value="18">Computers & Technology</option>
                    <option value="21">Sports & Athletics</option>
                    <option value="23">History</option>
                    <option value="22">Geography & World Capitals</option>
                    <option value="11">Movies & Cinema</option>
                    <option value="12">Music & Pop Culture</option>
                    <option value="15">Video Games</option>
                </select>
                <button class="btn-api" onclick="addTriviaToPlaylist()">➕ Add Standard Trivia Round</button>

                <hr style="border: 0; border-top: 1px solid #2a2a35; margin: 15px 0;">

                <!-- 2. Music & Decades Section -->
                <label>Music & Decades Section:</label>
                <select id="musicGenreSelect">
                    <option value="1980s pop rock">1980s Hits</option>
                    <option value="1990s britpop">1990s Hits</option>
                    <option value="2000s pop hits">2000s Hits</option>
                    <option value="2010s billboard hits">2010s Hits</option>
                    <option value="2020s pop hits">2020s Hits</option>
                    <option value="dance hits edm">Dance & Club Hits</option>
                    <option value="female pop artists">Female Artists</option>
                    <option value="male pop artists">Male Artists</option>
                    <option value="boy bands 90s 00s">Boy Bands</option>
                    <option value="girl bands pop">Girl Bands</option>
                    <option value="country music hits">Country Hits</option>
                    <option value="classic rock anthems">Rock Hits</option>
                    <option value="billboard number one hits">UK / US No.1s</option>
                    <option value="indie alternative rock">Indie & Alt</option>
                    <option value="motown soul legends">Motown & Soul</option>
                    <option value="jazz lounge classics">Jazz</option>
                    <option value="rnb soul hits">R&B</option>
                    <option value="rap hip hop hits">Rap & Hip-Hop</option>
                    <option value="uk garage old school">UK Garage</option>
                    <option value="tv theme songs">TV Show Theme Songs</option>
                    <option value="cartoon theme songs">Cartoon Theme Songs</option>
                    <option value="epic movie soundtracks">Movie Theme Songs</option>
                </select>
                <button class="btn-api" style="background:#ff9800; color:black;" onclick="addMusicToPlaylist()">➕ Add Music / Theme Round</button>

                <hr style="border: 0; border-top: 1px solid #2a2a35; margin: 15px 0;">

                <!-- 3. Dedicated Kids Music & Movie Section -->
                <label>Kids & Family Theme Songs Section:</label>
                <select id="kidsMusicGenreSelect">
                    <option value="disney songs singalong">Disney Movie Theme Songs</option>
                    <option value="disney channel songs">Disney Show Theme Songs</option>
                    <option value="marvel soundtrack theme">Marvel Theme Songs</option>
                    <option value="cbeebies theme songs kids">CBeebies Shows Theme Songs</option>
                    <option value="nickelodeon tv theme songs">Nickelodeon TV Show Themes</option>
                    <option value="cartoon network theme songs">Cartoon Network Theme Songs</option>
                </select>
                <button class="btn-api" style="background:#03dac6; color:black;" onclick="addKidsMusicToPlaylist()">➕ Add Kids Theme Song Round</button>

                <hr style="border: 0; border-top: 1px solid #2a2a35; margin: 15px 0;">

                <!-- 4. Dedicated Kids Trivia Section -->
                <label>Kids Trivia Section:</label>
                <select id="kidsTriviaSelect">
                    <option value="disney">Disney Trivia</option>
                    <option value="animals">Animals & Nature Trivia</option>
                    <option value="science">Fun Science Trivia</option>
                    <option value="geography">World Geography Trivia</option>
                </select>
                <button class="btn-api" style="background:#bb86fc; color:black;" onclick="addKidsTriviaToPlaylist()">➕ Add Kids Trivia Round</button>
            </div>

            <div class="panel">
                <h2>Playlist Queue (<span id="playlistCount">0</span>)</h2>
                <div id="playlistContainer">
                    <p style="color: #777; font-size: 14px;">No rounds in playlist yet. Add a round above!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let playlist = [];

        async function addTriviaToPlaylist() {
            const count = parseInt(document.getElementById('questionCountSelect').value);
            const timer = parseInt(document.getElementById('timerSelect').value);
            const betweenDelay = parseInt(document.getElementById('delaySelect').value);
            const categorySelect = document.getElementById('categorySelect');
            const categoryId = categorySelect.value;
            const categoryName = categoryId ? categorySelect.options[categorySelect.selectedIndex].text : "General";
            
            const btn = event.target;
            btn.textContent = "Fetching...";

            const questions = await fetchTriviaQuestions(count, categoryId);
            const roundName = `Trivia: ${categoryName} (${questions.length} Qs)`;

            playlist.push({ id: Date.now(), name: roundName, questions, timer, betweenDelay });
            btn.textContent = "➕ Add Standard Trivia Round";
            renderPlaylist();
        }

        async function addMusicToPlaylist() {
            const count = parseInt(document.getElementById('questionCountSelect').value);
            const timer = parseInt(document.getElementById('timerSelect').value);
            const betweenDelay = parseInt(document.getElementById('delaySelect').value);
            const musicSelect = document.getElementById('musicGenreSelect');
            const searchTerm = musicSelect.value;
            const genreName = musicSelect.options[musicSelect.selectedIndex].text;

            const btn = event.target;
            btn.textContent = "Fetching Audio Clips...";

            const isMovieOrTv = searchTerm.includes('theme') || searchTerm.includes('soundtrack');
            const questions = await fetchMusicPreviewRound(count, searchTerm, isMovieOrTv);
            const roundName = `Music: ${genreName} (${questions.length} Qs)`;

            playlist.push({ id: Date.now(), name: roundName, questions, timer, betweenDelay });
            btn.textContent = "➕ Add Music / Theme Round";
            renderPlaylist();
        }

        async function addKidsMusicToPlaylist() {
            const count = parseInt(document.getElementById('questionCountSelect').value);
            const timer = parseInt(document.getElementById('timerSelect').value);
            const betweenDelay = parseInt(document.getElementById('delaySelect').value);
            const kidsMusicSelect = document.getElementById('kidsMusicGenreSelect');
            const searchTerm = kidsMusicSelect.value;
            const genreName = kidsMusicSelect.options[kidsMusicSelect.selectedIndex].text;

            const btn = event.target;
            btn.textContent = "Fetching Kids Audio...";

            const questions = await fetchMusicPreviewRound(count, searchTerm, true);
            const roundName = `Kids Theme: ${genreName} (${questions.length} Qs)`;

            playlist.push({ id: Date.now(), name: roundName, questions, timer, betweenDelay });
            btn.textContent = "➕ Add Kids Theme Song Round";
            renderPlaylist();
        }

        async function addKidsTriviaToPlaylist() {
            const count = parseInt(document.getElementById('questionCountSelect').value);
            const timer = parseInt(document.getElementById('timerSelect').value);
            const betweenDelay = parseInt(document.getElementById('delaySelect').value);
            const kidsTriviaSelect = document.getElementById('kidsTriviaSelect');
            const subGenre = kidsTriviaSelect.value;
            const genreName = kidsTriviaSelect.options[kidsTriviaSelect.selectedIndex].text;

            const btn = event.target;
            btn.textContent = "Fetching Kids Trivia...";

            const questions = await fetchKidsTriviaQuestions(count, subGenre);
            const roundName = `Kids Trivia: ${genreName} (${questions.length} Qs)`;

            playlist.push({ id: Date.now(), name: roundName, questions, timer, betweenDelay });
            btn.textContent = "➕ Add Kids Trivia Round";
            renderPlaylist();
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            document.getElementById('playlistCount').textContent = playlist.length;

            if (playlist.length === 0) {
                container.innerHTML = '<p style="color: #777; font-size: 14px;">No rounds in playlist yet. Add a round above!</p>';
                return;
            }

            container.innerHTML = '';
            playlist.forEach((round, index) => {
                container.innerHTML += `
                    <div class="playlist-card">
                        <div>
                            <strong>${index + 1}. ${round.name}</strong>
                            <div style="font-size: 11px; color: #aaa; margin-top: 2px;">Timer: ${round.timer}s | Delay: ${round.betweenDelay}s</div>
                        </div>
                        <div>
                            <button class="btn-play" style="padding: 6px 12px; margin-top:0; font-size: 12px; width:auto; display:inline-block;" onclick="loadRound(${index})">📂 Load</button>
                            <button class="btn-danger" onclick="deleteRound(${index})">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function loadRound(index) {
            const round = playlist[index];
            socket.emit('hostAction', { 
                action: 'loadRound', 
                payload: { name: round.name, questions: round.questions, timer: round.timer, betweenDelay: round.betweenDelay } 
            });
            alert(`Loaded "${round.name}"! Now click "▶ Start / Resume Round" in Master Controls when ready.`);
        }

        function deleteRound(index) {
            playlist.splice(index, 1);
            renderPlaylist();
        }

        function sendAction(action) {
            socket.emit('hostAction', { action });
        }

        socket.on('updatePlayers', (players) => {
            const listEl = document.getElementById('playerList');
            const countEl = document.getElementById('playerCount');
            const playerIds = Object.keys(players);
            countEl.textContent = playerIds.length;
            
            if (playerIds.length === 0) {
                listEl.innerHTML = '<p style="color: #777; font-size: 14px;">No players connected yet.</p>';
                return;
            }

            listEl.innerHTML = '';
            playerIds.forEach(id => {
                const p = players[id];
                listEl.innerHTML += `<div style="padding: 6px; border-bottom:1px solid #333;">${p.avatar} ${p.name}</div>`;
            });
        });
    </script>
</body>
</html>
