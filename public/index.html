<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TriviaMania - Host Control Center</title>
    <style>
        :root { --bg: #090a10; --card: #131520; --primary: #9c27b0; --accent: #00e5ff; --text: #ffffff; --muted: #8a8d9f; --success: #00e676; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222538; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; color: var(--accent); }
        .nav-links a { color: var(--accent); text-decoration: none; margin-left: 15px; font-weight: bold; background: #1a1d2e; padding: 8px 12px; border-radius: 6px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #131520; border: 1px solid #2a2e45; color: var(--muted); padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .panel { background: var(--card); border: 1px solid #222538; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        h2 { font-size: 16px; margin-top: 0; color: var(--accent); border-bottom: 1px solid #222538; padding-bottom: 10px; }
        button { padding: 12px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #22263d; color: white; width: 100%; margin-top: 8px; }
        .btn-play { background: var(--success); color: black; }
        select, input, textarea { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #1a1d2d; border: 1px solid #333852; color: white; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 11px; color: var(--muted); font-weight: bold; text-transform: uppercase; }
        .playlist-card { background: #1a1d2d; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ TriviaMania Host Dashboard</h1>
        <div class="nav-links">
            <a href="/display.html" target="_blank">📺 Projector</a>
            <a href="/player.html" target="_blank">📱 Phone Link</a>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('control', this)">🕹️ Control Center</button>
        <button class="tab-btn" onclick="switchTab('playlist', this)">🎵 Playlist Builder</button>
    </div>

    <!-- TAB 1: CONTROL CENTER -->
    <div id="tab-control" class="tab-content active">
        <div class="panel">
            <h2>Master Game Controls</h2>
            <button class="btn-play" onclick="sendAction('resume')">▶ Start / Resume Round</button>
            <button onclick="sendAction('pause')">⏸ Pause Game</button>
            <button onclick="sendAction('restart')">🔄 Restart Round</button>
            <button style="background:var(--accent); color:black;" onclick="sendAction('reveal')">💡 Reveal Answer</button>
        </div>

        <div class="panel">
            <h2>Active Queue</h2>
            <div id="hostPlaylistQueue">No rounds loaded in queue yet.</div>
        </div>

        <div class="panel">
            <h2>Connected Teams (<span id="playerCount">0</span>)</h2>
            <div id="hostScoreList">No teams connected yet.</div>
        </div>
    </div>

    <!-- TAB 2: PLAYLIST BUILDER -->
    <div id="tab-playlist" class="tab-content">
        <div class="panel">
            <h2>Build Curated Rounds</h2>
            <label>Select Round Type:</label>
            <select id="curatedSelect">
                <option value="kids">🧸 Kids & Cartoons Round</option>
                <option value="classic_rock">🎵 Classic Rock Music Round</option>
                <option value="80s_hits">🎵 1980s Hits Music Round</option>
            </select>
            <button class="btn-api" style="background:#ff9100; color:black;" onclick="addCuratedRound()">➕ Add Round to Queue</button>
        </div>

        <div class="panel">
            <h2>Playlist Queue (<span id="playlistCount">0</span>)</h2>
            <div id="playlistContainer">No rounds in playlist yet.</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        const socket = io();
        let playlist = [];

        function addCuratedRound() {
            const type = document.getElementById('curatedSelect').value;
            let questions = [];
            let name = "";

            if (type === 'kids') {
                name = "Kids & Cartoons Round";
                questions = [
                    { q: "What kind of animal is Simba in The Lion King?", a: "Lion", options: ["Tiger", "Lion", "Leopard", "Cheetah"], type: 'trivia' },
                    { q: "In Frozen, what is the name of Elsa and Anna's kingdom?", a: "Arendelle", options: ["Corona", "Arendelle", "Atlantis", "Agrabah"], type: 'trivia' },
                    { q: "What color is Mickey Mouse's shorts?", a: "Red", options: ["Blue", "Yellow", "Red", "Green"], type: 'trivia' },
                    { q: "What is the name of Andy's cowboy toy in Toy Story?", a: "Woody", options: ["Buzz", "Woody", "Rex", "Slinky"], type: 'trivia' },
                    { q: "Which Pokémon is a yellow electric mouse?", a: "Pikachu", options: ["Charmander", "Squirtle", "Pikachu", "Bulbasaur"], type: 'trivia' }
                ];
            } else if (type === 'classic_rock') {
                name = "Classic Rock Music Round";
                questions = [
                    { q: "Name the artist / band performing this track", a: "Queen", options: ["The Beatles", "Queen", "Led Zeppelin", "Pink Floyd"], audioUrl: "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview115/v4/36/53/b7/3653b7c8-7013-8898-7240-23a595c2f5d9/mza_10795287019777178351.m43.aac", type: 'music' },
                    { q: "Name the artist / band performing this track", a: "The Beatles", options: ["The Rolling Stones", "The Beatles", "The Who", "The Kinks"], audioUrl: "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/c6/8e/3c/c68e3c6a-4d2c-8824-3458-1f6b814674d8/mza_11674482098716327668.m43.aac", type: 'music' }
                ];
            } else if (type === '80s_hits') {
                name = "1980s Hits Music Round";
                questions = [
                    { q: "Name the artist / band performing this track", a: "Michael Jackson", options: ["Prince", "George Michael", "Michael Jackson", "Lionel Richie"], audioUrl: "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/d2/88/ef/d288efd1-5544-245f-4a33-2a3162319ef5/mza_7143997193635392817.m43.aac", type: 'music' }
                ];
            }

            playlist.push({ name, questions, timer: 10, betweenDelay: 5 });
            renderPlaylist();
            alert(`Added "${name}"!`);
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            const queueEl = document.getElementById('hostPlaylistQueue');
            document.getElementById('playlistCount').textContent = playlist.length;
            
            if (playlist.length === 0) {
                container.innerHTML = 'No rounds in playlist yet.';
                queueEl.innerHTML = 'No rounds loaded in queue yet.';
                return;
            }

            container.innerHTML = '';
            queueEl.innerHTML = '';
            playlist.forEach((round, index) => {
                const html = `
                    <div class="playlist-card">
                        <div><strong>${index + 1}. ${round.name}</strong></div>
                        <button class="btn-play" style="padding: 6px 12px; width:auto; margin:0;" onclick="loadRound(${index})">Load</button>
                    </div>
                `;
                container.innerHTML += html;
                queueEl.innerHTML += html;
            });
        }

        function loadRound(index) {
            const round = playlist[index];
            socket.emit('hostAction', { action: 'loadRound', payload: round });
            alert(`Loaded "${round.name}" into master control!`);
        }

        function sendAction(action) {
            socket.emit('hostAction', { action });
        }

        socket.on('updatePlayers', (players) => {
            const listEl = document.getElementById('hostScoreList');
            const countEl = document.getElementById('playerCount');
            const sorted = Object.values(players).sort((a, b) => b.score - a.score);
            countEl.textContent = sorted.length;
            if (sorted.length === 0) {
                listEl.innerHTML = 'No teams connected yet.';
                return;
            }
            listEl.innerHTML = '';
            sorted.forEach((p, idx) => {
                listEl.innerHTML += `<div style="display:flex; justify-content:space-between; padding:4px 0;"><span>${idx + 1}. ${p.avatar} ${p.name}</span><strong>${p.score} pts</strong></div>`;
            });
        });
    </script>
</body>
</html>
