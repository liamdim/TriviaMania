<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Adverts Manager</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --neon-blue: #00f3ff;
            --neon-yellow: #ffee00;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #05050a 70%); }
        header { background: rgba(10, 15, 30, 0.9); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 238, 0, 0.3); }
        header h1 { font-size: 1.5rem; color: var(--neon-yellow); }
        .nav-links { display: flex; gap: 0.75rem; }
        .nav-links a { color: var(--neon-blue); text-decoration: none; padding: 0.5rem 1rem; background: rgba(0, 243, 255, 0.1); border-radius: 6px; border: 1px solid rgba(0, 243, 255, 0.3); font-size: 0.9rem; }
        .container { flex: 1; padding: 2rem; max-width: 900px; width: 100%; margin: 0 auto; }
        .card { background: var(--panel-bg); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(255, 238, 0, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        .card h3 { margin-bottom: 1rem; color: var(--neon-yellow); font-weight: 600; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        input { width: 100%; padding: 0.75rem; background: rgba(5, 10, 20, 0.8); border: 1px solid rgba(255, 238, 0, 0.3); color: white; border-radius: 6px; margin-bottom: 0.5rem; }
        button { background: linear-gradient(135deg, #aa7700, #ffee00); color: #000; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(255, 238, 0, 0.5); }
        button.danger { background: linear-gradient(135deg, #aa0033, #ff0055); color: #fff; }
        button.small { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
        .flex-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .ad-item { display: flex; justify-content: space-between; align-items: center; background: rgba(5, 10, 20, 0.6); padding: 0.75rem; border-radius: 8px; margin-bottom: 0.5rem; border: 1px solid rgba(255, 255, 255, 0.08); }
        .ad-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); margin-right: 10px; vertical-align: middle; }
    </style>
</head>
<body>
    <header>
        <h1>📢 Adverts & Sponsor Library</h1>
        <div class="nav-links">
            <a href="/index.html">⚡ Live Controls</a>
        </div>
    </header>
    <div class="container">
        <div class="card">
            <h3>Add New Advert / Sponsor</h3>
            <div class="form-group">
                <label>Advert Title / Message:</label>
                <input type="text" id="adTitleInput" placeholder="Tonight's Drink Special - 2 for 1 Cocktails!">
            </div>
            <div class="form-group">
                <label>Upload Sponsor Image / Graphic:</label>
                <input type="file" id="adImageInput" accept="image/*">
            </div>
            <button onclick="saveNewAdvert()">💾 Save Advert to Library</button>
        </div>
        <div class="card">
            <h3>Stored Adverts Manager</h3>
            <div id="storedAdvertsContainer"><p style="color: var(--text-muted);">No adverts stored yet.</p></div>
        </div>
    </div>
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let savedAdverts = JSON.parse(localStorage.getItem('triviamania_saved_adverts') || '[]');

        function saveNewAdvert() {
            const title = document.getElementById('adTitleInput').value.trim();
            const fileInput = document.getElementById('adImageInput');
            if (!title) { alert('Please enter an advert title!'); return; }

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        // Compress/resize image to max width 800px to prevent localStorage quota errors
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 800;
                        if (width > height && width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);

                        savedAdverts.push({ title, image: compressedDataUrl });
                        try {
                            localStorage.setItem('triviamania_saved_adverts', JSON.stringify(savedAdverts));
                            renderAdverts();
                            document.getElementById('adTitleInput').value = '';
                            fileInput.value = '';
                            alert('Advert with image saved successfully!');
                        } catch (err) {
                            alert('Storage error: Image file is still too large. Try a smaller image.');
                        }
                    };
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                savedAdverts.push({ title, image: null });
                try {
                    localStorage.setItem('triviamania_saved_adverts', JSON.stringify(savedAdverts));
                    renderAdverts();
                    document.getElementById('adTitleInput').value = '';
                    alert('Advert saved successfully!');
                } catch (err) {
                    alert('Storage error: LocalStorage is full.');
                }
            }
        }

        function renderAdverts() {
            const container = document.getElementById('storedAdvertsContainer');
            if (savedAdverts.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No adverts stored yet.</p>';
                return;
            }
            container.innerHTML = savedAdverts.map((ad, idx) => `
                <div class="ad-item">
                    <div style="display: flex; align-items: center;">
                        ${ad.image ? `<img src="${ad.image}" class="ad-thumb">` : ''}
                        <strong>${ad.title}</strong>
                    </div>
                    <div class="flex-row" style="gap: 0.5rem;">
                        <button class="small" style="background:#00ff66; color:#000;" onclick="showAdOnScreen(${idx})">Show on Display</button>
                        <button class="small danger" onclick="deleteAdvert(${idx})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function showAdOnScreen(index) {
            const ad = savedAdverts[index];
            socket.emit('broadcast-advert-screen', { text: ad.title, image: ad.image || null });
            alert('Broadcasting ad to projector display!');
        }

        function deleteAdvert(index) {
            savedAdverts.splice(index, 1);
            localStorage.setItem('triviamania_saved_adverts', JSON.stringify(savedAdverts));
            renderAdverts();
        }

fn: renderAdverts();
    </script>
</body>
</html>
