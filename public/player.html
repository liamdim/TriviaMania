<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaMania - Player Controller</title>
    <style>
        :root { --bg: #090a10; --card: #131520; --primary: #9c27b0; --accent: #00e5ff; --text: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; justify-content: center; align-items: center; }
        .card { background: var(--card); border: 2px solid var(--primary); border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(156, 39, 176, 0.4); text-align: center; box-sizing: border-box; }
        h1 { color: var(--accent); font-size: 32px; margin-top: 0; text-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        input { width: 100%; padding: 14px; margin: 10px 0 15px 0; background: #1a1d2d; border: 1px solid #333852; color: white; border-radius: 10px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 16px; background: var(--accent); color: black; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        
        .avatar-picker { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .avatar-option { font-size: 26px; padding: 8px; background: #1a1d2d; border: 2px solid #333; border-radius: 10px; cursor: pointer; }
        .avatar-option.selected { border-color: var(--accent); background: rgba(0, 229, 255, 0.2); }

        .game-screen { display: none; width: 100%; max-width: 400px; text-align: center; }
        .options-container { display: flex; flex-direction: column; gap: 14px; margin: 20px 0; }
        .choice-btn { background: #1a1d2d; border: 2px solid var(--primary); color: white; padding: 16px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: left; }
        .choice-btn:hover { background: var(--primary); color: white; }
        .score-badge { background: #1a1d2d; padding: 8px 18px; border-radius: 20px; border: 1px solid var(--accent); display: inline-block; margin-bottom: 15px; font-weight: bold; color: var(--accent); font-size: 16px; }
        
        .audio-unlock-btn { background: #00e676; color: black; margin-bottom: 12px; font-size: 14px; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; border: none; cursor: pointer; }
        .poll-container { background: #1a1d2d; border: 1px solid var(--accent); padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; text-align: left; }
        .poll-btn { background: #22263d; border: 1px solid var(--primary); color: white; padding: 10px; border-radius: 8px; margin-top: 8px; width: 100%; text-align: center; font-weight: bold; cursor: pointer; font-size: 14px; }
        .poll-btn:hover { background: var(--primary); }

        .reaction-tray { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; border-top: 1px solid #222538; padding-top: 12px; }
        .reaction-btn { background: #1a1d2d; border: 1px solid #333852; border-radius: 8px; font-size: 20px; padding: 6px; cursor: pointer; }
        .reaction-btn:hover { background: var(--primary); }

        .tip-jar-btn { background: #ff9100; color: black; margin-top: 12px; display: none; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center; box-shadow: 0 0 10px rgba(255,145,0,0.4); }

        #mobileAdvertModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(9, 10, 16, 0.95); z-index: 99999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; flex-direction: column; }
        #mobileAdvertModal img { max-width: 90vw; max-height: 65vh; border-radius: 12px; border: 2px solid var(--accent); box-shadow: 0 0 30px rgba(0, 229, 255, 0.5); margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="mobileAdvertModal">
        <h3 style="color:var(--accent); margin-top:0;">📢 Featured Sponsor Advert</h3>
        <img id="mobileAdvertImage" src="" alt="Advert">
        <button style="width:auto; padding: 10px 25px; background:var(--accent); color:black;" onclick="closeMobileAdvert()">Dismiss Advert</button>
    </div>

    <div id="joinScreen" class="card">
        <h1>TriviaMania</h1>
        <p style="color: #a4a8bc; font-size: 14px; margin-bottom: 10px;">Choose your avatar & enter team name:</p>
        
        <div class="avatar-picker">
            <div class="avatar-option selected" onclick="selectAvatar('🍻', this)">🍻</div>
            <div class="avatar-option" onclick="selectAvatar('🚀', this)">🚀</div>
            <div class="avatar-option" onclick="selectAvatar('🦊', this)">🦊</div>
            <div class="avatar-option" onclick="selectAvatar('🌮', this)">🌮</div>
            <div class="avatar-option" onclick="selectAvatar('🎸', this)">🎸</div>
        </div>

        <input type="text" id="playerName" placeholder="Team Name" maxlength="20">
        <input type="text" id="playerMotto" placeholder="Team Motto / Tagline" maxlength="30">
        <button onclick="attemptJoin()">Join Game</button>
    </div>

    <div id="gameScreen" class="game-screen">
        <div class="card">
            <button class="audio-unlock-btn" onclick="unlockAudio()">🔊 Tap Here to Enable Phone Audio</button>
            <h2 id="welcomeHeader" style="color: var(--accent); margin-top:0; font-size: 22px;"></h2>
            <div class="score-badge">Score: <span id="playerScore">0</span> pts</div>
            <p id="gameStatusText" style="color: #a4a8bc; font-size: 15px; margin: 10px 0;">Waiting in lobby...</p>
            
            <div id="mobilePollBox" class="poll-container">
                <div style="font-size:12px; color:var(--accent); font-weight:bold; text-transform:uppercase; margin-bottom:4px;">📊 Icebreaker Poll</div>
                <div id="mobilePollQuestion" style="font-size:14px; font-weight:bold; margin-bottom:8px;"></div>
                <div id="mobilePollOptions"></div>
            </div>

            <div id="answerSection" style="display:none;">
                <p id="currentQuestionPrompt" style="font-size: 15px; color: #fff; margin-bottom: 12px; font-weight: bold;"></p>
                <div class="options-container" id="playerOptionsGrid"></div>
            </div>

            <!-- Audio element for mobile music previews -->
            <div id="mobileAudioContainer" style="display:none;"></div>

            <div class="reaction-tray">
                <button class="reaction-btn" onclick="sendReaction('🍻')">🍻</button>
                <button class="reaction-btn" onclick="sendReaction('😂')">😂</button>
                <button class="reaction-btn" onclick="sendReaction('👎')">👎</button>
                <button class="reaction-btn" onclick="sendReaction('🎉')">🎉</button>
                <button class="reaction-btn" onclick="sendReaction('67')">67</button>
            </div>

            <a id="tipJarLink" href="#" target="_blank" class="tip-jar-btn">🎁 Tip / Support the Quizmaster</a>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myTeamName = "";
        let selectedAvatar = '🍻';
        let dismissedAdvert = false;

        let audioCtx = null;
        function unlockAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Play silent buffer to unlock mobile audio context completely
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);

            alert('Phone audio enabled successfully!');
        }

        function selectAvatar(emoji, element) {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedAvatar = emoji;
        }

        socket.on('syncState', (state) => {
            const statusText = document.getElementById('gameStatusText');
            const answerSection = document.getElementById('answerSection');
            const promptEl = document.getElementById('currentQuestionPrompt');
            const optionsGrid = document.getElementById('playerOptionsGrid');
            const mobileAdvertModal = document.getElementById('mobileAdvertModal');
            const mobileAdvertImage = document.getElementById('mobileAdvertImage');
            const tipJarLink = document.getElementById('tipJarLink');
            const mobilePollBox = document.getElementById('mobilePollBox');
            const mobilePollQuestion = document.getElementById('mobilePollQuestion');
            const mobilePollOptions = document.getElementById('mobilePollOptions');
            const mobileAudioContainer = document.getElementById('mobileAudioContainer');

            if (state.tipJarActive && state.tipJarUrl) {
                tipJarLink.href = state.tipJarUrl;
                tipJarLink.style.display = 'block';
            } else {
                tipJarLink.style.display = 'none';
            }

            const isJoined = document.getElementById('gameScreen').style.display === 'block';

            if (isJoined && state.pollActive && state.status === 'waiting') {
                mobilePollBox.style.display = 'block';
                mobilePollQuestion.textContent = state.pollQuestion;
                mobilePollOptions.innerHTML = '';
                state.pollOptions.forEach((opt, idx) => {
                    mobilePollOptions.innerHTML += `<button class="poll-btn" onclick="votePoll(${idx})">${opt}</button>`;
                });
            } else {
                mobilePollBox.style.display = 'none';
            }

            if (isJoined && state.mobileAdvertActive && state.advertImage) {
                if (!dismissedAdvert) {
                    mobileAdvertImage.src = state.advertImage;
                    mobileAdvertModal.style.display = 'flex';
                }
            } else {
                mobileAdvertModal.style.display = 'none';
                if (!state.mobileAdvertActive) dismissedAdvert = false;
            }

            if (isJoined && state.status === 'active' && state.currentRound && state.currentRound.questions) {
                const round = state.currentRound;
                const qIndex = round.currentIndex || 0;
                const currentQ = round.questions[qIndex];

                statusText.textContent = `Question ${qIndex + 1} of ${round.questions.length} ${round.speedBonus ? '⚡' : ''}`;
                answerSection.style.display = 'block';
                promptEl.textContent = currentQ.q;

                optionsGrid.innerHTML = '';
                if (currentQ.options) {
                    currentQ.options.forEach((opt, idx) => {
                        const letter = ['A', 'B', 'C', 'D'][idx];
                        const btn = document.createElement('button');
                        btn.className = 'choice-btn';
                        btn.innerHTML = `<strong style="color:var(--accent);">${letter}:</strong> ${opt}`;
                        btn.onclick = () => selectAnswer(opt);
                        optionsGrid.appendChild(btn);
                    });
                }

                // Play music preview on phone if available
                if (currentQ.audioUrl) {
                    mobileAudioContainer.innerHTML = `<audio autoplay src="${currentQ.audioUrl}"></audio>`;
                    const phoneAudio = mobileAudioContainer.querySelector('audio');
                    if (phoneAudio) {
                        phoneAudio.play().catch(e => console.log("Phone audio autoplay restricted:", e));
                    }
                } else {
                    mobileAudioContainer.innerHTML = '';
                }

            } else if (isJoined && state.status === 'revealed') {
                statusText.textContent = "Answer Revealed on Projector! Check leaderboard.";
                answerSection.style.display = 'none';
                mobileAudioContainer.innerHTML = '';
            } else if (isJoined && state.status === 'podium') {
                statusText.textContent = "🎉 Game Over! Check projector for final podium winners!";
                answerSection.style.display = 'none';
                mobileAudioContainer.innerHTML = '';
            } else if (isJoined) {
                mobileAudioContainer.innerHTML = '';
                if (!state.mobileAdvertActive && !state.pollActive) {
                    statusText.textContent = "Waiting for host to start...";
                } else if (state.pollActive) {
                    statusText.textContent = "Cast your vote in the poll below!";
                }
                answerSection.style.display = 'none';
            }
        });

        function votePoll(optionIndex) {
            socket.emit('submitPollVote', { optionIndex });
            alert('Vote submitted!');
        }

        function closeMobileAdvert() {
            document.getElementById('mobileAdvertModal').style.display = 'none';
            dismissedAdvert = true;
        }

        function attemptJoin() {
            const nameInput = document.getElementById('playerName');
            const mottoInput = document.getElementById('playerMotto');
            myTeamName = nameInput.value.trim();
            const motto = mottoInput.value.trim() || 'Here for a good time!';

            if (!myTeamName) {
                alert('Please enter a team name!');
                return;
            }
            socket.emit('playerJoin', { name: myTeamName, avatar: selectedAvatar, motto });
            
            document.getElementById('joinScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('welcomeHeader').textContent = myTeamName;
        }

        function sendReaction(emoji) {
            if ("vibrate" in navigator) navigator.vibrate(40);
            socket.emit('sendReaction', { emoji, teamName: myTeamName });
        }

        function selectAnswer(optionText) {
            if ("vibrate" in navigator) navigator.vibrate(60);
            socket.emit('submitAnswer', { answer: optionText });
            document.getElementById('answerSection').style.display = 'none';
            document.getElementById('gameStatusText').textContent = `Locked in: "${optionText}"! Waiting for reveal...`;
        }

        socket.on('updatePlayers', (players) => {
            for (const id in players) {
                if (players[id].name === myTeamName) {
                    document.getElementById('playerScore').textContent = players[id].score;
                }
            }
        });
    </script>
</body>
</html>
