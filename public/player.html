<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Player Controller</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-red: #ff0055;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 1rem; justify-content: space-between; }
        header { text-align: center; padding: 0.75rem; background: rgba(10, 15, 30, 0.9); border-bottom: 1px solid rgba(0, 243, 255, 0.3); border-radius: 8px; margin-bottom: 1rem; }
        header h1 { font-size: 1.25rem; color: var(--neon-blue); }
        .container { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 500px; width: 100%; margin: 0 auto; }
        .card { background: var(--panel-bg); border-radius: 12px; padding: 1.5rem; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); margin-bottom: 1rem; }
        button { padding: 1rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; width: 100%; transition: 0.2s; margin-bottom: 0.75rem; }
        button:hover { filter: brightness(1.2); }
        .btn-green { background: linear-gradient(135deg, #00aa44, var(--neon-green)); color: #000; }
        .btn-blue { background: linear-gradient(135deg, #0077ff, var(--neon-blue)); color: white; }
        input[type="text"] { width: 100%; padding: 1rem; background: rgba(5, 10, 20, 0.9); border: 1px solid rgba(0, 243, 255, 0.4); color: white; border-radius: 8px; font-size: 1.1rem; margin-bottom: 1rem; text-align: center; }
        
        /* Options Grid for Questions */
        .options-container { display: flex; flex-direction: column; gap: 0.75rem; }
        .option-btn { background: rgba(0, 243, 255, 0.15); border: 2px solid var(--neon-blue); color: white; padding: 1.2rem; border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { background: rgba(0, 243, 255, 0.3); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        
        /* Direct Feedback Colors */
        .option-btn.reveal-correct { background: var(--neon-green) !important; color: #000 !important; border-color: var(--neon-green) !important; box-shadow: 0 0 15px var(--neon-green); }

        /* Mobile Advert Overlay */
        #mobileAdvertOverlay { position: fixed; inset: 0; background: rgba(5,5,10,0.95); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1 id="appTitle">⚡ TriviaMania</h1>
    </header>

    <div class="container">
        <!-- JOIN SCREEN -->
        <div class="card" id="joinScreen">
            <h3 style="color: var(--neon-blue); margin-bottom: 1rem; text-align: center;">Enter Player / Team Name</h3>
            <input type="text" id="playerNameInput" placeholder="Your Team Name..." maxlength="25">
            <button class="btn-green" onclick="joinGame()">🚀 Join Trivia Game</button>
        </div>

        <!-- WAITING / LOBBY SCREEN -->
        <div class="card" id="waitingScreen" style="display: none; text-align: center;">
            <h3 style="color: var(--neon-green); margin-bottom: 0.5rem;" id="waitingHeader">You're In!</h3>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;" id="waitingSubtext">Waiting for host to start the game...</p>
            <p id="personalScoreDisplay" style="color: var(--neon-yellow); font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem;"></p>
            
            <div id="pollSection" style="background: rgba(5,10,20,0.6); padding: 1rem; border-radius: 8px; border: 1px solid rgba(0,243,255,0.2); margin-top: 1rem; display: none;">
                <h4 style="color: var(--neon-yellow); margin-bottom: 0.5rem;" id="pollQ">Lobby Poll</h4>
                <div id="pollBtns" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
            </div>
        </div>

        <!-- QUESTION SCREEN -->
        <div class="card" id="questionScreen" style="display: none;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-muted);">
                <span id="qCounter">Question 1</span>
                <span id="timerDisplay" style="color: var(--neon-yellow); font-weight: bold;">Time: 15s</span>
            </div>
            <h3 id="activeQuestionText" style="font-size: 1.3rem; margin-bottom: 1.5rem; text-align: center; line-height: 1.3;">Question text...</h3>
            <div class="options-container" id="questionOptionsContainer"></div>
            <p id="answerFeedbackBanner" style="text-align: center; margin-top: 1rem; font-weight: bold; font-size: 1.1rem;"></p>
        </div>

        <!-- LIVE CHAT BOX -->
        <div class="card" id="chatCard" style="display: none; margin-top: auto;">
            <h4 style="color: var(--neon-blue); margin-bottom: 0.5rem; font-size: 0.95rem;">💬 Table Chat</h4>
            <div id="chatFeed" style="height: 80px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-muted);"></div>
            <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="chatInput" placeholder="Send message..." style="margin-bottom: 0; font-size: 0.9rem; padding: 0.5rem;">
                <button class="btn-blue" style="width: 80px; padding: 0.5rem; margin-bottom: 0; font-size: 0.9rem;" onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- Mobile Advert Overlay -->
    <div id="mobileAdvertOverlay">
        <h3 style="color: var(--neon-yellow); margin-bottom: 1rem;">📢 SPONSOR MESSAGE</h3>
        <p id="mobileAdvertText" style="font-size: 1.2rem; margin-bottom: 1.5rem; line-height: 1.4;"></p>
        <div id="mobileAdvertImageContainer" style="margin-bottom: 1.5rem;"></div>
        <button class="btn-blue" onclick="dismissMobileAdvert()">Got It / Close</button>
    </div>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let playerName = '';
        let hasAnswered = false;
        let currentQuestionIndexTracker = -1;

        function joinGame() {
            const input = document.getElementById('playerNameInput');
            playerName = input.value.trim();
            if (!playerName) { alert('Please enter your team name!'); return; }

            socket.emit('player-join', playerName);
            document.getElementById('joinScreen').style.display = 'none';
            document.getElementById('waitingScreen').style.display = 'block';
            document.getElementById('chatCard').style.display = 'block';
            document.getElementById('appTitle').innerText = '👤 ' + playerName;
        }

        socket.on('state-update', (state) => {
            if (state.scores) {
                const myId = socket.id;
                const me = state.scores[myId];
                if (me) {
                    document.getElementById('personalScoreDisplay').innerText = `Your Score: ${me.score} pts | Streak: 🔥 x${me.streak || 0}`;
                }
            }

            if (state.status === 'QUESTION') {
                if (currentQuestionIndexTracker !== state.currentQuestionIndex) {
                    currentQuestionIndexTracker = state.currentQuestionIndex;
                    hasAnswered = false;
                    document.getElementById('answerFeedbackBanner').innerText = '';
                }

                document.getElementById('waitingScreen').style.display = 'none';
                document.getElementById('questionScreen').style.display = 'block';

                const round = state.playlist[state.currentRoundIndex];
                if (round && round.questions) {
                    const q = round.questions[state.currentQuestionIndex];
                    if (q) {
                        document.getElementById('qCounter').innerText = `Round ${state.currentRoundIndex + 1} // Q ${state.currentQuestionIndex + 1}`;
                        document.getElementById('activeQuestionText').innerText = q.question;

                        const container = document.getElementById('questionOptionsContainer');
                        if (!hasAnswered) {
                            if (q.options && q.options.length > 0) {
                                container.innerHTML = q.options.map((opt, idx) => `
                                    <button class="option-btn" id="opt-btn-${idx}" onclick="submitAnswer('${opt.replace(/'/g, "\\'")}', this)">${opt}</button>
                                `).join('');
                            } else {
                                container.innerHTML = `
                                    <input type="text" id="textAnswerInput" placeholder="Type your answer..." style="margin-bottom:0.75rem;">
                                    <button class="btn-green" id="textSubmitBtn" onclick="submitTextAnswer()">Submit Answer</button>
                                `;
                            }
                        }
                    }
                }
            } else if (state.status === 'IDLE' || state.status === 'PAUSED' || state.status === 'LEADERBOARD') {
                if (playerName) {
                    document.getElementById('waitingScreen').style.display = 'block';
                    document.getElementById('questionScreen').style.display = 'none';
                }

                if (state.lobbySettings && state.lobbySettings.showPoll) {
                    document.getElementById('pollSection').style.display = 'block';
                    document.getElementById('pollQ').innerText = state.lobbySettings.pollQuestion;
                    const pollBtns = document.getElementById('pollBtns');
                    pollBtns.innerHTML = state.lobbySettings.pollOptions.map(opt => `
                        <button class="btn-blue" style="padding: 0.6rem; font-size: 0.95rem; margin-bottom:0.3rem;" onclick="socket.emit('poll-vote', '${opt.replace(/'/g, "\\'")}')">${opt}</button>
                    `).join('');
                } else {
                    document.getElementById('pollSection').style.display = 'none';
                }
            }
        });

        function submitAnswer(ans, btnElement) {
            if (hasAnswered) return;
            hasAnswered = true;

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            socket.emit('submit-answer', { answer: ans, timeRemaining: 15 });
        }

        function submitTextAnswer() {
            const input = document.getElementById('textAnswerInput');
            const submitBtn = document.getElementById('textSubmitBtn');
            if (!input || hasAnswered) return;
            hasAnswered = true;
            if (submitBtn) submitBtn.disabled = true;
            if (input) input.disabled = true;
            
            socket.emit('submit-answer', { answer: input.value.trim(), timeRemaining: 15 });
        }

        socket.on('answer-result', (res) => {
            const allBtns = document.querySelectorAll('.option-btn');
            
            allBtns.forEach(b => {
                const text = b.innerText.trim();
                if (text.toLowerCase() === res.correctAnswer.toLowerCase()) {
                    b.classList.add('reveal-correct');
                }
            });

            const banner = document.getElementById('answerFeedbackBanner');
            if (res.correct) {
                banner.innerText = `✅ Correct! +${res.points} pts (Streak 🔥 x${res.streak})`;
                banner.style.color = 'var(--neon-green)';
            } else {
                banner.innerText = `❌ Incorrect! Correct answer was: ${res.correctAnswer}`;
                banner.style.color = 'var(--neon-red)';
            }
        });

        socket.on('timer-tick', (timeLeft) => {
            const t = document.getElementById('timerDisplay');
            if (t) t.innerText = `Time: ${timeLeft}s`;
        });

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            socket.emit('player-chat', msg);
            input.value = '';
        }

        socket.on('chat-message', (msg) => {
            const feed = document.getElementById('chatFeed');
            if (feed) {
                feed.innerHTML += `<div><strong>${msg.name}:</strong> ${msg.text}</div>`;
                feed.scrollTop = feed.scrollHeight;
            }
        });

        socket.on('broadcast-advert-mobile', (ad) => {
            document.getElementById('mobileAdvertText').innerText = ad.text;
            document.getElementById('mobileAdvertImageContainer').innerHTML = ad.image ? `<img src="${ad.image}" style="max-height: 180px; border-radius: 6px; border: 1px solid var(--neon-blue);">` : '';
            document.getElementById('mobileAdvertOverlay').style.display = 'flex';
        });

        socket.on('hide-advert-mobile', () => {
            dismissMobileAdvert();
        });

        function dismissMobileAdvert() {
            document.getElementById('mobileAdvertOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
