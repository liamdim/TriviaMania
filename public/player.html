<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaMania - Player Controller</title>
    <style>
        :root { 
            --bg: #090a10; 
            --card: #131520; 
            --primary: #9c27b0; 
            --accent: #00e5ff; 
            --text: #ffffff; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            box-sizing: border-box; 
            justify-content: center; 
            align-items: center; 
        }
        .card { 
            background: var(--card); 
            border: 2px solid var(--primary); 
            border-radius: 20px; 
            padding: 30px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 10px 30px rgba(156, 39, 176, 0.4); 
            text-align: center; 
            box-sizing: border-box;
        }
        h1 { 
            color: var(--accent); 
            font-size: 32px; 
            margin-top: 0; 
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.4); 
        }
        input { 
            width: 100%; 
            padding: 16px; 
            margin: 15px 0 20px 0; 
            background: #1a1d2d; 
            border: 1px solid #333852; 
            color: white; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 18px; 
            text-align: center; 
        }
        button { 
            width: 100%; 
            padding: 16px; 
            background: var(--accent); 
            color: black; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 18px; 
            cursor: pointer; 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); 
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        
        /* Game Screen inside phone controller */
        #gameScreen { display: none; width: 100%; max-width: 400px; text-align: center; }
        .options-container { display: flex; flex-direction: column; gap: 14px; margin: 20px 0; }
        .choice-btn { 
            background: #1a1d2d; 
            border: 2px solid var(--primary); 
            color: white; 
            padding: 16px; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: left; 
        }
        .choice-btn:hover { background: var(--primary); color: white; }
        .score-badge { 
            background: #1a1d2d; 
            padding: 8px 18px; 
            border-radius: 20px; 
            border: 1px solid var(--accent); 
            display: inline-block; 
            margin-bottom: 15px; 
            font-weight: bold; 
            color: var(--accent); 
            font-size: 16px;
        }
        
        /* Mobile Advert Popup Modal */
        #mobileAdvertModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(9, 10, 16, 0.95); z-index: 99999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; flex-direction: column; }
        #mobileAdvertModal img { max-width: 90vw; max-height: 65vh; border-radius: 12px; border: 2px solid var(--accent); box-shadow: 0 0 30px rgba(0, 229, 255, 0.5); margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- Mobile Advert Popup Modal -->
    <div id="mobileAdvertModal">
        <h3 style="color:var(--accent); margin-top:0;">📢 Featured Sponsor Advert</h3>
        <img id="mobileAdvertImage" src="" alt="Advert">
        <button style="width:auto; padding: 10px 25px; background:var(--accent); color:black;" onclick="closeMobileAdvert()">Dismiss Advert</button>
    </div>

    <!-- Phone Sign-In Screen -->
    <div id="joinScreen" class="card">
        <h1>TriviaMania</h1>
        <p style="color: #a4a8bc; font-size: 15px; margin-bottom: 25px;">Enter your team name to join the game:</p>
        <input type="text" id="playerName" placeholder="e.g. The Quizly Bears" maxlength="20">
        <button onclick="attemptJoin()">Join Game</button>
    </div>

    <!-- Active Gameplay Controller Screen -->
    <div id="gameScreen" class="game-screen">
        <div class="card">
            <h2 id="welcomeHeader" style="color: var(--accent); margin-top:0; font-size: 24px;"></h2>
            <div class="score-badge">Score: <span id="playerScore">0</span> pts</div>
            <p id="gameStatusText" style="color: #a4a8bc; font-size: 16px; margin: 15px 0;">Waiting in lobby...</p>
            
            <div id="answerSection" style="display:none;">
                <p id="currentQuestionPrompt" style="font-size: 16px; color: #fff; margin-bottom: 15px; font-weight: bold;"></p>
                <div class="options-container" id="playerOptionsGrid"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myTeamName = "";
        let dismissedAdvert = false;

        socket.on('syncState', (state) => {
            const statusText = document.getElementById('gameStatusText');
            const answerSection = document.getElementById('answerSection');
            const promptEl = document.getElementById('currentQuestionPrompt');
            const optionsGrid = document.getElementById('playerOptionsGrid');
            const mobileAdvertModal = document.getElementById('mobileAdvertModal');
            const mobileAdvertImage = document.getElementById('mobileAdvertImage');

            const isJoined = document.getElementById('gameScreen').style.display === 'block';
            if (isJoined && state.mobileAdvertActive && state.advertImage) {
                if (!dismissedAdvert) {
                    mobileAdvertImage.src = state.advertImage;
                    mobileAdvertModal.style.display = 'flex';
                }
            } else {
                mobileAdvertModal.style.display = 'none';
                if (!state.mobileAdvertActive) dismissedAdvert = false;
            }

            if (isJoined && state.status === 'active' && state.currentRound && state.currentRound.questions) {
                const round = state.currentRound;
                const qIndex = round.currentIndex || 0;
                const currentQ = round.questions[qIndex];

                statusText.textContent = `Question ${qIndex + 1} of ${round.questions.length}`;
                answerSection.style.display = 'block';
                promptEl.textContent = currentQ.q;

                optionsGrid.innerHTML = '';
                if (currentQ.options) {
                    currentQ.options.forEach((opt, idx) => {
                        const letter = ['A', 'B', 'C', 'D'][idx];
                        const btn = document.createElement('button');
                        btn.className = 'choice-btn';
                        btn.innerHTML = `<strong style="color:var(--accent);">${letter}:</strong> ${opt}`;
                        btn.onclick = () => selectAnswer(opt);
                        optionsGrid.appendChild(btn);
                    });
                }
            } else if (isJoined && state.status === 'revealed') {
                statusText.textContent = "Answer Revealed on Projector! Check leaderboard.";
                answerSection.style.display = 'none';
            } else if (isJoined) {
                if (!state.mobileAdvertActive) {
                    statusText.textContent = "Waiting for host to start...";
                }
                answerSection.style.display = 'none';
            }
        });

        function closeMobileAdvert() {
            document.getElementById('mobileAdvertModal').style.display = 'none';
            dismissedAdvert = true;
        }

        function attemptJoin() {
            const nameInput = document.getElementById('playerName');
            myTeamName = nameInput.value.trim();
            if (!myTeamName) {
                alert('Please enter a team name!');
                return;
            }
            socket.emit('playerJoin', { name: myTeamName });
            
            // Explicitly hide sign-in card and show mobile controller
            document.getElementById('joinScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('welcomeHeader').textContent = myTeamName;
        }

        function selectAnswer(optionText) {
            if ("vibrate" in navigator) navigator.vibrate(60);
            socket.emit('submitAnswer', { answer: optionText });
            document.getElementById('answerSection').style.display = 'none';
            document.getElementById('gameStatusText').textContent = `Locked in: "${optionText}"! Waiting for reveal...`;
        }

        socket.on('updatePlayers', (players) => {
            for (const id in players) {
                if (players[id].name === myTeamName) {
                    document.getElementById('playerScore').textContent = players[id].score;
                }
            }
        });
    </script>
</body>
</html>
