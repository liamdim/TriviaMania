<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Player Controller</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: #0f172a;
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-red: #ff0055;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 1rem; }
        .hidden { display: none !important; }
        
        .card { background: var(--panel-bg); border-radius: 12px; padding: 1.25rem; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 100%; max-width: 450px; margin: auto; }
        h2 { color: var(--neon-blue); text-align: center; margin-bottom: 1rem; font-size: 1.4rem; }
        input[type="text"] { width: 100%; padding: 0.85rem; background: rgba(5,10,20,0.9); border: 1px solid rgba(0,243,255,0.4); color: white; border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; text-align: center; }
        button { width: 100%; padding: 0.85rem; border-radius: 8px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-green { background: linear-gradient(135deg, #00aa44, var(--neon-green)); color: #000; }
        
        .option-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--neon-blue); color: white; padding: 1rem; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 0.75rem; text-align: center; }
        .option-btn:hover, .option-btn:active { background: var(--neon-blue); color: #000; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="card">
        <h2>TriviaMania</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">Enter your team or player name to join:</p>
        <input type="text" id="playerNameInput" placeholder="Player / Team Name" maxlength="20">
        <button class="btn-green" onclick="joinGame()">Join Game 🚀</button>
    </div>

    <!-- GAME PLAY SCREEN -->
    <div id="gameScreen" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">
            <span id="displayPlayerName" style="color: var(--neon-blue); font-weight: bold;">Player</span>
            <span id="displayPlayerScore" style="color: var(--neon-green); font-weight: bold;">0 pts</span>
        </div>

        <div id="statusMessage" style="text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 1rem; color: var(--neon-yellow);">Waiting for host to start...</div>

        <!-- QUESTION CONTAINER -->
        <div id="questionContainer" class="hidden">
            <p id="questionText" style="font-size: 1rem; margin-bottom: 1rem; text-align: center;"></p>
            <div id="optionsContainer"></div>
        </div>

        <!-- DIGITAL MUSIC BINGO TICKET CONTAINER -->
        <div id="musicBingoContainer" class="hidden" style="text-align: center; margin-top: 1rem;">
            <h3 style="color: var(--neon-green); margin-bottom: 0.3rem; font-size: 1.1rem;">🎵 Music Bingo Ticket</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem;">Tap songs as they play to dab!</p>
            <div id="playerBingoGrid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; max-width: 100%;"></div>
        </div>
    </div>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let myName = '';

        function joinGame() {
            const input = document.getElementById('playerNameInput');
            myName = input.value.trim();
            if (!myName) {
                alert('Please enter your name.');
                return;
            }
            socket.emit('player-join', myName);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('displayPlayerName').innerText = myName;
        }

        socket.on('state-update', (state) => {
            // Update personal score
            if (state.scores) {
                const me = Object.values(state.scores).find(p => p.name === myName);
                if (me) {
                    document.getElementById('displayPlayerScore').innerText = me.score + ' pts';
                }
            }

            const statusMsg = document.getElementById('statusMessage');
            const qContainer = document.getElementById('questionContainer');

            if (state.status === 'IDLE' || state.status === 'PAUSED' || state.status === 'INTERMISSION') {
                statusMsg.innerText = state.status === 'INTERMISSION' ? 'Round Intermission' : 'Waiting for host...';
                qContainer.classList.add('hidden');
            } else if (state.status === 'QUESTION') {
                statusMsg.innerText = 'Question Live! Make your pick:';
                qContainer.classList.remove('hidden');

                const round = state.playlist[state.currentRoundIndex];
                if (round && round.questions) {
                    const q = round.questions[state.currentQuestionIndex];
                    if (q) {
                        document.getElementById('questionText').innerText = q.question;
                        const optsContainer = document.getElementById('optionsContainer');
                        
                        if (q.gameType === 'higher-lower') {
                            optsContainer.innerHTML = `
                                <button class="option-btn" style="background:rgba(0,255,102,0.2); border-color:#00ff66;" onclick="submitAnswer('Higher')">📈 Higher</button>
                                <button class="option-btn" style="background:rgba(255,0,85,0.2); border-color:#ff0055;" onclick="submitAnswer('Lower')">📉 Lower</button>
                            `;
                        } else if (q.options && q.options.length > 0) {
                            optsContainer.innerHTML = q.options.map(opt => `
                                <button class="option-btn" onclick="submitAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</button>
                            `).join('');
                        } else {
                            optsContainer.innerHTML = `
                                <input type="text" id="textAnswerInput" placeholder="Type answer...">
                                <button class="btn-green" onclick="submitTextAnswer()">Submit Answer</button>
                            `;
                        }
                    }
                }
            }
        });

        function submitAnswer(ans) {
            socket.emit('submit-answer', { answer: ans, timeRemaining: 15 });
            document.getElementById('optionsContainer').innerHTML = '<p style="text-align:center; color:var(--neon-green); font-weight:bold;">Answer Locked In! ✓</p>';
        }

        function submitTextAnswer() {
            const val = document.getElementById('textAnswerInput').value.trim();
            if (val) submitAnswer(val);
        }

        // Native Digital Music Bingo Ticket Handlers
        socket.on('music-bingo-cards-assigned', (allCards) => {
            const myCardData = allCards[socket.id];
            if (myCardData) {
                renderPlayerBingoCard(myCardData);
                document.getElementById('musicBingoContainer').classList.remove('hidden');
            }
        });

        socket.on('bingo-card-updated', (updatedCard) => {
            renderPlayerBingoCard(updatedCard);
        });

        socket.on('bingo-winner', (data) => {
            alert(`🎉 BINGO! We have a winner: ${data.name}!`);
        });

        function renderPlayerBingoCard(cardData) {
            const grid = document.getElementById('playerBingoGrid');
            grid.innerHTML = cardData.card.map((song, idx) => {
                const isMarked = cardData.marked[idx];
                const bg = isMarked ? '#00ff66' : 'rgba(0,243,255,0.1)';
                const color = isMarked ? '#000' : '#fff';
                return `
                    <div onclick="socket.emit('mark-bingo-tile', ${idx})" style="background: ${bg}; color: ${color}; border: 1px solid #00f3ff; border-radius: 4px; padding: 6px 2px; font-size: 0.65rem; font-weight: bold; min-height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; word-break: break-word; text-align: center;">
                        ${song}
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
