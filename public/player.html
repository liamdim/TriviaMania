<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaMania - Player Mobile</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 1.2rem; padding-bottom: 70px; }
        
        .container { max-width: 500px; width: 100%; margin: auto; }
        .card { background: var(--panel-bg); border-radius: 16px; padding: 2rem; border: 1px solid #334155; box-shadow: 0 8px 25px rgba(0,0,0,0.4); text-align: center; }
        
        input { width: 100%; padding: 1rem; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 10px; font-size: 1.1rem; margin-bottom: 1rem; text-align: center; }
        button { width: 100%; padding: 1rem; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--accent-hover); }

        .option-btn { width: 100%; padding: 1.25rem; background: #0f172a; border: 2px solid #475569; color: var(--text); border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-bottom: 0.85rem; cursor: pointer; transition: 0.2s; text-align: left; padding-left: 1.5rem; }
        .option-btn.selected-lock { background: var(--accent) !important; border-color: white !important; color: white !important; box-shadow: 0 0 15px rgba(59,130,246,0.6); }
        .option-btn.correct { background: rgba(34, 197, 94, 0.4) !important; border-color: var(--success) !important; color: #4ade80 !important; }
        .option-btn.incorrect { background: rgba(239, 68, 68, 0.4) !important; border-color: var(--danger) !important; color: #f87171 !important; }
        .option-btn.reveal-correct { background: rgba(34, 197, 94, 0.2) !important; border-color: #16a34a !important; color: #86efac !important; }

        .meta-info { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; font-weight: 600; text-transform: uppercase; }
        
        .emoji-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 1.5rem; }
        .emoji-btn { background: #0f172a; border: 1px solid #475569; border-radius: 8px; font-size: 1.6rem; padding: 0.5rem; cursor: pointer; transition: 0.2s; text-align: center; }
        .emoji-btn:active { transform: scale(0.9); background: var(--accent); }

        #announcementBanner { position: fixed; bottom: 0; left: 0; right: 0; background: var(--warning); color: #000; padding: 0.75rem 1rem; font-weight: bold; text-align: center; display: none; z-index: 200; box-shadow: 0 -4px 15px rgba(0,0,0,0.5); font-size: 1rem; }

        #advertOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 300; padding: 2rem; text-align: center; }
        #advertOverlay img { max-height: 300px; max-width: 90%; border-radius: 10px; margin-top: 1.5rem; border: 2px solid var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <div id="app" class="card">
            <h2>Join TriviaMania</h2>
            <p style="color: var(--text-muted); margin: 1rem 0 1.5rem 0;">Enter your player or team name to enter:</p>
            <input type="text" id="playerNameInput" placeholder="Your Name or Team">
            <button onclick="joinGame()">Join Game 🚀</button>
        </div>
    </div>

    <div id="announcementBanner">📢 <span id="announcementText"></span></div>

    <div id="advertOverlay">
        <h2 id="adTitleText" style="color: var(--accent); font-size: 2rem; margin-bottom: 1rem;"></h2>
        <img id="adImageTag" src="" alt="Sponsor Advert" style="display: none;">
    </div>

    <script>
        const socket = io();
        const letters = ['A', 'B', 'C', 'D'];
        let myName = '';
        let hasAnswered = false;
        let selectedAnswerText = '';
        let lastQuestionIndex = -1;
        let answerResultState = null;
        let earnedPoints = 0;
        let currentCorrectAnswer = '';
        let countdownSoundEnabled = true;
        let myStreak = 0;

        function playMobileSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'countdown') {
                    if (!countdownSoundEnabled) return;
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'lock') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'incorrect') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.setValueAtTime(110, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        socket.on('announcement-update', (announcement) => {
            const banner = document.getElementById('announcementBanner');
            const textEl = document.getElementById('announcementText');
            if (announcement.active && announcement.text) {
                textEl.innerText = announcement.text;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        });

        function sendEmoji(emoji) {
            playMobileSound('lock');
            socket.emit('send-emoji', emoji);
        }

        function joinGame() {
            const input = document.getElementById('playerNameInput');
            myName = input.value.trim();
            if (!myName) { alert('Please enter a name!'); return; }
            
            playMobileSound('correct');
            socket.emit('player-join', myName);
            renderWaitingScreen('Waiting for host to start...');
        }

        function renderWaitingScreen(message) {
            document.getElementById('app').innerHTML = `
                <h2>${myName}</h2>
                ${myStreak > 1 ? `<p style="color: var(--warning); font-weight: bold; margin-top: 0.4rem;">🔥 Streak: x${myStreak}</p>` : ''}
                <p style="color: var(--text-muted); margin-top: 1rem; font-size: 1.1rem;">${message}</p>
                <div style="margin-top: 1.5rem; border-top: 1px solid #334155; padding-top: 1rem;">
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;">Send reaction to big screen:</p>
                    <div class="emoji-grid">
                        <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                        <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
                        <button class="emoji-btn" onclick="sendEmoji('🍺')">🍺</button>
                        <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                        <button class="emoji-btn" onclick="sendEmoji('🧠')">🧠</button>
                        <button class="emoji-btn" onclick="sendEmoji('🎉')">🎉</button>
                        <button class="emoji-btn" onclick="sendEmoji('❤️')">❤️</button>
                        <button class="emoji-btn" onclick="sendEmoji('🚀')">🚀</button>
                        <button class="emoji-btn" onclick="sendEmoji('👑')">👑</button>
                        <button class="emoji-btn" onclick="sendEmoji('67')"><strong style="font-size: 1.1rem;">67</strong></button>
                    </div>
                </div>
            `;
        }

        socket.on('state-update', (state) => {
            if (state.settings && state.settings.countdownSound !== undefined) {
                countdownSoundEnabled = state.settings.countdownSound;
            }

            const app = document.getElementById('app');
            const adOverlay = document.getElementById('advertOverlay');

            if (state.activeMobileAdvert) {
                document.getElementById('adTitleText').innerText = state.activeMobileAdvert.title;
                const imgTag = document.getElementById('adImageTag');
                if (state.activeMobileAdvert.image) {
                    imgTag.src = state.activeMobileAdvert.image;
                    imgTag.style.display = 'block';
                } else {
                    imgTag.style.display = 'none';
                }
                adOverlay.style.display = 'flex';
                return;
            } else {
                adOverlay.style.display = 'none';
            }

            if (!myName) return;

            if (state.status === 'IDLE' || state.status === 'LOBBY' || state.status === 'PAUSED') {
                renderWaitingScreen('Get ready! Game starting soon.');
            } else if (state.status === 'QUESTION') {
                const round = state.playlist[state.currentRoundIndex];
                if (!round) return;
                const q = round.questions[state.currentQuestionIndex];
                if (!q) return;

                currentCorrectAnswer = q.answer;

                if (lastQuestionIndex !== state.currentQuestionIndex) {
                    hasAnswered = false;
                    selectedAnswerText = '';
                    answerResultState = null;
                    earnedPoints = 0;
                    lastQuestionIndex = state.currentQuestionIndex;
                }

                app.innerHTML = `
                    <div class="meta-info">
                        <span>Q ${state.currentQuestionIndex + 1} of ${round.questions.length}</span>
                        <span id="timerDisplay" style="color: var(--accent);">${state.timer}s</span>
                    </div>
                    ${myStreak > 1 ? `<div style="background: rgba(245, 158, 11, 0.2); border: 1px solid var(--warning); color: var(--warning); padding: 0.3rem; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.75rem;">🔥 Streak Active: x${myStreak} Multiplier!</div>` : ''}
                    <h3 style="margin-bottom: 1.5rem; font-size: 1.25rem; line-height: 1.4;">${q.question}</h3>
                    <div id="optionsContainer">
                        ${q.options.map((opt, idx) => {
                            const isSelected = selectedAnswerText === opt;
                            const isCorrectAnswer = currentCorrectAnswer && opt.trim().toLowerCase() === currentCorrectAnswer.trim().toLowerCase();
                            
                            let btnClass = '';
                            let badgeText = '';

                            if (hasAnswered) {
                                if (isSelected) {
                                    if (answerResultState === 'correct') {
                                        btnClass = 'correct';
                                        badgeText = `<br><span style="font-size: 0.9rem; color: #4ade80;">✓ Correct! (+${earnedPoints} pts)</span>`;
                                    } else if (answerResultState === 'incorrect') {
                                        btnClass = 'incorrect';
                                        badgeText = `<br><span style="font-size: 0.9rem; color: #f87171;">✗ Incorrect</span>`;
                                    } else {
                                        btnClass = 'selected-lock';
                                    }
                                } else if (answerResultState && isCorrectAnswer) {
                                    btnClass = 'reveal-correct';
                                    badgeText = `<br><span style="font-size: 0.9rem; color: #86efac;">✓ Correct Answer</span>`;
                                }
                            }

                            return `<button class="option-btn ${btnClass}" ${hasAnswered ? 'disabled' : ''} onclick="submitAnswer(this, '${opt.replace(/'/g, "\\'")}', ${state.timer})"><strong>${letters[idx]}.</strong> ${opt}${badgeText}</button>`;
                        }).join('')}
                    </div>
                    ${hasAnswered && !answerResultState ? `<p style="margin-top: 1rem; font-size: 0.95rem; color: var(--accent);">Answer locked in! ✓</p>` : ''}
                `;
            } else if (state.status === 'LEADERBOARD') {
                const players = Object.values(state.scores || {}).sort((a, b) => b.score - a.score);
                const myRank = players.findIndex(p => p.name === myName) + 1;
                const myScoreObj = state.scores[socket.id] || { score: 0, streak: 0 };
                myStreak = myScoreObj.streak || 0;
                
                const round = state.playlist[state.currentRoundIndex];
                const isRoundEnd = round && (state.currentQuestionIndex + 1 >= round.questions.length);

                app.innerHTML = `
                    <h2 style="color: var(--success); margin-bottom: 0.5rem;">${isRoundEnd ? '🏁 Round Finished!' : 'Score Update'}</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Check the big screen for full rankings</p>
                    <div style="background: #0f172a; padding: 1.5rem; border-radius: 12px; border: 1px solid #475569;">
                        <p style="font-size: 1rem; color: var(--text-muted);">Your Score</p>
                        <h1 style="font-size: 2.5rem; color: var(--accent); margin: 0.5rem 0;">${myScoreObj.score}</h1>
                        <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">Your Rank: <strong style="color: var(--success);">#${myRank > 0 ? myRank : '-'}</strong></p>
                        <p style="font-size: 0.95rem; color: var(--warning);">Streak: <strong>🔥 x${myStreak}</strong></p>
                    </div>
                `;
            }
        });

        socket.on('timer-tick', (timeLeft) => {
            const timerEl = document.getElementById('timerDisplay');
            if (timerEl) {
                timerEl.innerText = timeLeft + 's';
                if (timeLeft <= 5) {
                    playMobileSound('countdown');
                }
            }
        });

        function submitAnswer(btnElement, answerText, timeRemaining) {
            if (hasAnswered) return;
            hasAnswered = true;
            selectedAnswerText = answerText;

            playMobileSound('lock');
            socket.emit('submit-answer', { answer: answerText, timeRemaining });

            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            btnElement.classList.add('selected-lock');
        }

        socket.on('answer-result', ({ correct, points, streak, isFastest }) => {
            answerResultState = correct ? 'correct' : 'incorrect';
            earnedPoints = points;
            myStreak = streak;

            if (correct) playMobileSound('correct');
            else playMobileSound('incorrect');

            document.querySelectorAll('.option-btn').forEach(btn => {
                const rawText = btn.innerText.replace(/^[A-D]\.\s*/, '').split('\n')[0].trim();
                const prefixMatch = btn.innerHTML.match(/<strong>([A-D]\.)<\/strong>/);
                const prefix = prefixMatch ? prefixMatch[0] : '';

                const isSelected = selectedAnswerText && rawText.toLowerCase() === selectedAnswerText.toLowerCase();
                const isCorrectAnswer = currentCorrectAnswer && rawText.toLowerCase() === currentCorrectAnswer.toLowerCase();

                btn.classList.remove('selected-lock');

                if (isSelected) {
                    if (correct) {
                        btn.classList.add('correct');
                        let badgeExtra = isFastest ? '⚡ Fastest Finger! ' : '';
                        btn.innerHTML = `${prefix} ${rawText}<br><span style="font-size: 0.9rem; color: #4ade80;">✓ ${badgeExtra}+${points} pts (🔥x${streak})</span>`;
                    } else {
                        btn.classList.add('incorrect');
                        btn.innerHTML = `${prefix} ${rawText}<br><span style="font-size: 0.9rem; color: #f87171;">✗ Incorrect</span>`;
                    }
                } else if (isCorrectAnswer) {
                    btn.classList.add('reveal-correct');
                    btn.innerHTML = `${prefix} ${rawText}<br><span style="font-size: 0.9rem; color: #86efac;">✓ Correct Answer</span>`;
                }
            });
        });
    </script>
</body>
</html>
