<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaMania - Player Controller</title>
    <style>
        :root { --bg: #090a10; --card: #131520; --primary: #9c27b0; --accent: #00e5ff; --text: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; justify-content: center; align-items: center; }
        .card { background: var(--card); border: 1px solid var(--primary); border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(156, 39, 176, 0.4); text-align: center; }
        h1 { color: var(--accent); font-size: 26px; margin-top: 0; text-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }
        input { width: 100%; padding: 14px; margin: 10px 0 20px 0; background: #1a1d2d; border: 1px solid #333852; color: white; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 16px; background: var(--accent); color: black; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
        
        .game-screen { display: none; width: 100%; max-width: 400px; text-align: center; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .choice-btn { background: #1a1d2d; border: 2px solid var(--primary); color: white; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: left; }
        .choice-btn:hover { background: var(--primary); color: white; }
        .score-badge { background: #1a1d2d; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--accent); display: inline-block; margin-bottom: 15px; font-weight: bold; color: var(--accent); }
        
        .payment-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(9, 10, 16, 0.95); z-index: 999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .paypal-btn { background: #ff9100; color: black; margin-top: 15px; display: block; text-decoration: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; text-align: center; }
        .advert-banner-mobile { background: rgba(0, 229, 255, 0.1); border: 1px solid var(--accent); padding: 8px; border-radius: 8px; margin-top: 15px; font-size: 13px; color: var(--accent); display: none; }
    </style>
</head>
<body>

    <div id="paymentModal" class="payment-modal">
        <div class="card">
            <h2 style="color:var(--accent); margin-top:0;">💳 Entry Fee Required</h2>
            <p style="color: #8a8d9f; font-size: 14px;">This game has a <strong id="priceDisplay" style="color:white;"></strong> entry fee. Please pay via PayPal before joining:</p>
            <a id="modalPaypalLink" href="#" target="_blank" class="paypal-btn">Pay Entry via PayPal</a>
            <button style="background:#22263d; color:white; margin-top:15px;" onclick="confirmPaymentDone()">I've Paid! Enter Game</button>
        </div>
    </div>

    <div id="joinScreen" class="card">
        <h1>TriviaMania</h1>
        <p style="color: #8a8d9f; font-size: 14px;">Enter your team name to join:</p>
        <input type="text" id="playerName" placeholder="Team Name" maxlength="20">
        <button onclick="attemptJoin()">Join Game</button>
    </div>

    <div id="gameScreen" class="game-screen">
        <div class="card">
            <h2 id="welcomeHeader" style="color: var(--accent); margin-top:0;"></h2>
            <div class="score-badge">Score: <span id="playerScore">0</span> pts</div>
            <p id="gameStatusText" style="color: #8a8d9f; font-size: 14px;">Waiting for host to start...</p>
            
            <div id="answerSection" style="display:none;">
                <p id="currentQuestionPrompt" style="font-size: 15px; color: #fff; margin-bottom: 10px;"></p>
                <div class="options-container" id="playerOptionsGrid"></div>
            </div>

            <div id="mobileAdvertNotice" class="advert-banner-mobile">📢 Special Featured Sponsor Active on Screen!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myTeamName = "";
        let globalSettings = { entryPrice: '0', paypalUrl: '' };

        socket.on('syncState', (state) => {
            globalSettings.entryPrice = state.entryPrice || '0';
            globalSettings.paypalUrl = state.paypalUrl || '';

            const statusText = document.getElementById('gameStatusText');
            const answerSection = document.getElementById('answerSection');
            const promptEl = document.getElementById('currentQuestionPrompt');
            const optionsGrid = document.getElementById('playerOptionsGrid');
            const mobileAdvertNotice = document.getElementById('mobileAdvertNotice');

            if (state.advertActive) {
                mobileAdvertNotice.style.display = 'block';
            } else {
                mobileAdvertNotice.style.display = 'none';
            }

            if (state.status === 'active' && state.currentRound && state.currentRound.questions) {
                const round = state.currentRound;
                const qIndex = round.currentIndex || 0;
                const currentQ = round.questions[qIndex];

                statusText.textContent = `Question ${qIndex + 1} of ${round.questions.length}`;
                answerSection.style.display = 'block';
                promptEl.textContent = currentQ.q;

                optionsGrid.innerHTML = '';
                if (currentQ.options) {
                    currentQ.options.forEach((opt, idx) => {
                        const letter = ['A', 'B', 'C', 'D'][idx];
                        const btn = document.createElement('button');
                        btn.className = 'choice-btn';
                        btn.innerHTML = `<strong style="color:var(--accent);">${letter}:</strong> ${opt}`;
                        btn.onclick = () => selectAnswer(opt);
                        optionsGrid.appendChild(btn);
                    });
                }
            } else if (state.status === 'revealed') {
                statusText.textContent = "Answer Revealed on Projector! Check leaderboard.";
                answerSection.style.display = 'none';
            } else {
                statusText.textContent = "Waiting for next question...";
                answerSection.style.display = 'none';
            }
        });

        function attemptJoin() {
            myTeamName = document.getElementById('playerName').value.trim();
            if (!myTeamName) {
                alert('Please enter a team name!');
                return;
            }

            const priceNum = parseFloat(globalSettings.entryPrice);
            if (priceNum > 0 && globalSettings.paypalUrl) {
                document.getElementById('priceDisplay').textContent = `£${priceNum.toFixed(2)}`;
                document.getElementById('modalPaypalLink').href = globalSettings.paypalUrl;
                document.getElementById('paymentModal').style.display = 'flex';
            } else {
                finalizeJoin();
            }
        }

        function confirmPaymentDone() {
            document.getElementById('paymentModal').style.display = 'none';
            finalizeJoin();
        }

        function finalizeJoin() {
            socket.emit('playerJoin', { name: myTeamName });
            document.getElementById('joinScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('welcomeHeader').textContent = myTeamName;
        }

        function selectAnswer(optionText) {
            if ("vibrate" in navigator) navigator.vibrate(60);
            socket.emit('submitAnswer', { answer: optionText });
            document.getElementById('answerSection').style.display = 'none';
            document.getElementById('gameStatusText').textContent = `Locked in: "${optionText}"! Waiting for reveal...`;
        }

        socket.on('updatePlayers', (players) => {
            for (const id in players) {
                if (players[id].name === myTeamName) {
                    document.getElementById('playerScore').textContent = players[id].score;
                }
            }
        });
    </script>
</body>
</html>
