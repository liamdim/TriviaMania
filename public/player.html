<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TriviaMania - Player Controller</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 1rem; position: relative; overflow-x: hidden; }
        
        .card { background: var(--panel-bg); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #334155; text-align: center; }
        input, button { width: 100%; padding: 1rem; font-size: 1.1rem; border-radius: 8px; border: none; margin-bottom: 1rem; font-weight: bold; }
        input { background: #0f172a; border: 1px solid #475569; color: white; text-align: center; }
        button { background: var(--accent); color: white; cursor: pointer; }
        button:active { transform: scale(0.98); }
        
        .options-stack { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
        .option-btn { background: #334155; color: white; font-size: 1.2rem; padding: 1.2rem; border-radius: 10px; border: 2px solid #475569; }
        .option-btn.selected { background: var(--accent); border-color: white; }

        .emoji-bar { display: flex; justify-content: space-around; background: #0f172a; padding: 0.5rem; border-radius: 8px; margin-top: 0.5rem; border: 1px solid #334155; }
        .emoji-btn { background: transparent; border: none; font-size: 1.5rem; cursor: pointer; padding: 0.2rem; width: auto; margin-bottom: 0; }
        
        #announcementBanner { background: var(--accent); color: white; padding: 0.75rem; border-radius: 8px; font-weight: bold; margin-bottom: 1rem; display: none; text-align: center; }
        #mobileAdModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.98); z-index: 999; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; text-align: center; }
        #mobileAdModal img { max-width: 100%; max-height: 350px; border-radius: 8px; margin-top: 1rem; border: 2px solid var(--accent); }

        .floating-emoji { position: fixed; bottom: -50px; font-size: 2.5rem; animation: floatUp 3s linear forwards; z-index: 1000; pointer-events: none; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <audio id="mobileAudioPlayer" preload="auto"></audio>

    <div id="mobileAdModal">
        <h3 id="mobileAdTitle" style="color: var(--accent); font-size: 1.8rem; margin-bottom: 0.5rem;"></h3>
        <div id="mobileAdImageContainer"></div>
    </div>

    <div id="announcementBanner"></div>

    <div id="joinScreen" class="card" style="margin-top: auto; margin-bottom: auto;">
        <h2>Enter Quiz Arena</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">Choose your player nickname</p>
        <input type="text" id="playerNameInput" placeholder="Your Nickname" maxlength="15">
        <button onclick="joinGame()">Join Game 🚀</button>
    </div>

    <div id="gameScreen" style="display: none; flex: 1; flex-direction: column;">
        <div class="card" style="padding: 0.75rem; display: flex; justify-content: space-between; align-items: center;">
            <span id="playerDisplayName" style="font-weight: bold; color: var(--accent);">Player</span>
            <span id="playerScoreDisplay" style="font-weight: bold; color: var(--success);">0 pts</span>
        </div>

        <div id="gameStage" class="card" style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
            <h3>Waiting for host to start game...</h3>
        </div>

        <div id="chatControlsWrapper">
            <div class="card" style="padding: 0.75rem; margin-bottom: 0.5rem; text-align: left;">
                <div style="font-size: 0.85rem; color: var(--accent); font-weight: bold; margin-bottom: 0.4rem;">💬 Live Room Chat</div>
                <div id="mobileChatLog" style="height: 110px; overflow-y: auto; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 0.5rem; font-size: 0.85rem; margin-bottom: 0.5rem; display: flex; flex-direction: column; gap: 0.3rem;">
                    <span style="color: var(--text-muted); font-style: italic;">Welcome to the room! Say hi...</span>
                </div>
                <div style="display: flex; gap: 0.4rem;">
                    <input type="text" id="playerChatInput" placeholder="Type a message..." maxlength="60" style="margin-bottom: 0; flex: 1; padding: 0.5rem; font-size: 0.85rem;">
                    <button onclick="sendPlayerChat()" style="width: auto; margin-bottom: 0; padding: 0.5rem 1rem; font-size: 0.85rem;">Send</button>
                </div>
            </div>

            <div class="emoji-bar" id="emojiBarContainer">
                <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="sendEmoji('🍻')">🍻</button>
                <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
                <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="sendEmoji('🎉')">🎉</button>
                <button class="emoji-btn" onclick="sendEmoji('💡')">💡</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myName = '';
        let answeredCurrent = false;

        const badWords = [
            'damn', 'hell', 'shit', 'fuck', 'bitch', 'crap', 'ass', 
            'bastard', 'cunt', 'dick', 'piss', 'cock', 'prick', 'wanker', 'arse'
        ];

        function sanitizeText(text) {
            if (!text) return '';
            let clean = text.trim();
            badWords.forEach(word => {
                const regex = new RegExp(`\\b${word}\\b`, 'gi');
                clean = clean.replace(regex, '****');
            });
            return clean;
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        socket.on('stop-audio', () => {
            const audio = document.getElementById('mobileAudioPlayer');
            audio.pause();
            audio.currentTime = 0;
        });

        socket.on('timer-tick', (timeLeft) => {
            if (timeLeft <= 5 && timeLeft > 0) {
                playBeep();
            }
        });

        socket.on('announcement-update', (announcement) => {
            const banner = document.getElementById('announcementBanner');
            if (announcement.active && announcement.text) {
                banner.style.display = 'block';
                banner.innerText = '📢 ' + announcement.text;
            } else {
                banner.style.display = 'none';
            }
        });

        socket.on('player-emoji', (data) => {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = data.emoji;
            el.style.left = (10 + Math.random() * 80) + 'vw';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        });

        socket.on('chat-message', (data) => {
            if (data.name === (myName || 'You')) return;
            appendChatMessage(data.name, sanitizeText(data.text));
        });

        function appendChatMessage(name, text) {
            const chatLog = document.getElementById('mobileChatLog');
            if (chatLog) {
                if (chatLog.children.length === 1 && chatLog.children[0].style.fontStyle === 'italic') {
                    chatLog.innerHTML = '';
                }
                const msgEl = document.createElement('div');
                msgEl.innerHTML = `<span style="color: var(--accent); font-weight: bold;">${name}:</span> ${sanitizeText(text)}`;
                chatLog.appendChild(msgEl);
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        }

        function joinGame() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name) { alert('Please enter a nickname!'); return; }
            myName = sanitizeText(name);
            socket.emit('player-join', myName);
            document.getElementById('joinScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('playerDisplayName').innerText = myName;
        }

        function sendEmoji(emoji) {
            socket.emit('send-emoji', emoji);
        }

        function sendPlayerChat() {
            const input = document.getElementById('playerChatInput');
            const message = input.value.trim();
            if (!message) return;

            const cleanMessage = sanitizeText(message);
            appendChatMessage(myName || 'You', cleanMessage);

            socket.emit('player-chat', cleanMessage);
            input.value = '';
        }

        socket.on('state-update', (state) => {
            const player = state.scores[socket.id];
            if (player) {
                document.getElementById('playerScoreDisplay').innerText = player.score + ' pts';
            }

            const chatWrapper = document.getElementById('chatControlsWrapper');
            if (state.chatEnabled === false) {
                chatWrapper.style.display = 'none';
            } else {
                chatWrapper.style.display = 'block';
                if (state.customEmojis) {
                    const emojiBar = document.getElementById('emojiBarContainer');
                    emojiBar.innerHTML = state.customEmojis.map(emoji => 
                        `<button class="emoji-btn" onclick="sendEmoji('${emoji}')">${emoji}</button>`
                    ).join('');
                }
            }

            if (state.chatHistory && state.chatHistory.length > 0) {
                const chatLog = document.getElementById('mobileChatLog');
                if (chatLog && chatLog.children.length <= 1) {
                    chatLog.innerHTML = state.chatHistory.map(msg => 
                        `<div><span style="color: var(--accent); font-weight: bold;">${msg.name}:</span> ${sanitizeText(msg.text)}</div>`
                    ).join('');
                    chatLog.scrollTop = chatLog.scrollHeight;
                }
            }

            const waitingText = state.mobileWaitingText || 'Waiting for host to start game...';

            const adModal = document.getElementById('mobileAdModal');
            if (state.activeMobileAdvert) {
                adModal.style.display = 'flex';
                document.getElementById('mobileAdTitle').innerText = state.activeMobileAdvert.title;
                const imgContainer = document.getElementById('mobileAdImageContainer');
                if (state.activeMobileAdvert.image) {
                    imgContainer.innerHTML = `<img src="${state.activeMobileAdvert.image}" />`;
                } else {
                    imgContainer.innerHTML = '';
                }
            } else {
                adModal.style.display = 'none';
            }

            const stage = document.getElementById('gameStage');

            if (state.status === 'IDLE' || state.status === 'LOBBY') {
                stage.innerHTML = `<h3>${waitingText}</h3><p style="color: var(--text-muted); margin-top: 1rem;">Get ready!</p>`;
            } else if (state.status === 'QUESTION') {
                const round = state.playlist[state.currentRoundIndex];
                const q = round ? round.questions[state.currentQuestionIndex] : null;

                if (q) {
                    if (q.audioPreviewUrl) {
                        const audio = document.getElementById('mobileAudioPlayer');
                        if (audio.src !== q.audioPreviewUrl) {
                            audio.src = q.audioPreviewUrl;
                            audio.load();
                            audio.play().catch(e => console.log("Mobile autoplay restricted"));
                        }
                    }

                    if (player && player.hasAnsweredCurrent) {
                        stage.innerHTML = `<h3>Answer Locked In! ✔</h3><p style="color: var(--text-muted); margin-top: 1rem;">Waiting for timer to expire...</p>`;
                    } else {
                        answeredCurrent = false;
                        if (q.gameType === 'lingo') {
                            stage.innerHTML = `
                                <p style="font-size: 1.1rem; margin-bottom: 0.5rem; font-weight: bold;">${q.question}</p>
                                <div class="form-group" style="margin-top: 1rem;">
                                    <input type="text" id="lingoInput" placeholder="ENTER 5-LETTER WORD" maxlength="5" style="text-transform: uppercase; font-size: 1.5rem; letter-spacing: 4px; margin-bottom: 1rem;">
                                    <button class="success" onclick="submitLingoAnswer()">Submit Guess 🎯</button>
                                </div>
                            `;
                        } else {
                            stage.innerHTML = `
                                <p style="font-size: 1.1rem; margin-bottom: 1rem; font-weight: bold;">${q.question}</p>
                                <div class="options-stack">
                                    ${q.options.map(opt => `<button class="option-btn" onclick="submitAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}
                                </div>
                            `;
                        }
                    }
                }
            } else if (state.status === 'LEADERBOARD') {
                const audio = document.getElementById('mobileAudioPlayer');
                audio.pause();
                stage.innerHTML = `<h3>☕ Intermission / Leaderboard</h3><p style="color: var(--text-muted); margin-top: 1rem;">Check the big screen for standings!</p>`;
            } else if (state.status === 'PAUSED') {
                const audio = document.getElementById('mobileAudioPlayer');
                audio.pause();
                stage.innerHTML = `<h1>Game Paused by Host</h1><p style="color: var(--text-muted); margin-top: 1rem;">Stand by...</p>`;
            }
        });

        function submitAnswer(answer) {
            if (answeredCurrent) return;
            answeredCurrent = true;
            socket.emit('submit-answer', { answer, timeRemaining: 15 });
            document.getElementById('gameStage').innerHTML = `<h3>Answer Submitted! 🎯</h3><p style="color: var(--text-muted); margin-top: 1rem;">Waiting for results...</p>`;
        }

        function submitLingoAnswer() {
            const input = document.getElementById('lingoInput');
            const val = input ? input.value.trim().toUpperCase() : '';
            if (val.length !== 5) {
                alert('Please enter a 5-letter word!');
                return;
            }
            submitAnswer(val);
        }
    </script>
</body>
</html>
