<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Player Arena</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-red: #ff0055;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 1rem; background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #05050a 70%); }
        .container { max-width: 500px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; gap: 1rem; }
        .card { background: var(--panel-bg); border-radius: 12px; padding: 1.25rem; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .card h3 { color: var(--neon-blue); margin-bottom: 0.75rem; font-size: 1.1rem; }
        input[type="text"] { width: 100%; padding: 0.85rem; background: rgba(5,10,20,0.9); border: 1px solid rgba(0,243,255,0.4); color: white; border-radius: 8px; font-size: 1rem; margin-bottom: 0.75rem; }
        button { padding: 0.85rem; border-radius: 8px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; width: 100%; }
        button:hover { filter: brightness(1.2); }
        .btn-green { background: linear-gradient(135deg, #00aa44, var(--neon-green)); color: #000; }
        .btn-blue { background: linear-gradient(135deg, #0077ff, var(--neon-blue)); color: white; }
        .btn-option { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--neon-blue); color: white; margin-bottom: 0.5rem; text-align: left; padding: 1rem; border-radius: 8px; font-size: 1rem; }
        .btn-option:active { background: var(--neon-blue); color: #000; }
        .hidden { display: none !important; }
        .emoji-bar { display: flex; gap: 0.5rem; justify-content: space-around; margin-top: 0.5rem; }
        .emoji-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-size: 1.5rem; padding: 0.5rem; border-radius: 8px; cursor: pointer; flex: 1; }
        .chat-feed { background: rgba(0,0,0,0.4); border: 1px solid rgba(0,243,255,0.2); border-radius: 8px; height: 120px; overflow-y: auto; padding: 8px; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-muted); }
        
        /* Floating Emojis Animation */
        .floating-emoji { position: fixed; bottom: 20px; font-size: 2.5rem; animation: floatUp 2s ease-out forwards; z-index: 999; pointer-events: none; }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-400px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="loginCard" class="card" style="margin-top: auto; margin-bottom: auto;">
            <h3>📱 Join TriviaMania</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Enter your team or player name to jump into the game!</p>
            <input type="text" id="playerNameInput" placeholder="Team / Player Name..." onkeypress="if(event.key==='Enter') joinGame()">
            <button class="btn-green" onclick="joinGame()">🚀 Join Arena</button>
        </div>

        <!-- GAMEPLAY ARENA (Hidden until login) -->
        <div id="gameCard" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid rgba(0,243,255,0.2); padding-bottom: 0.5rem;">
                <span id="playerWelcomeHeader" style="font-weight: bold; color: var(--neon-blue);">Player</span>
                <span style="color: var(--neon-yellow); font-weight: bold;">Score: <span id="playerScoreDisplay">0</span> pts</span>
            </div>

            <!-- QUESTION VIEW -->
            <div id="questionContainer" class="hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <span style="font-size: 0.85rem; color: var(--text-muted);">Question Timer:</span>
                    <span id="timerDisplay" style="color: var(--neon-yellow); font-weight: bold; font-size: 1.1rem;">15s</span>
                </div>
                <h3 id="questionText" style="color: white; margin-bottom: 1rem; font-size: 1.2rem;">Waiting for next question...</h3>
                <div id="optionsContainer"></div>
                <div id="answerFeedback" style="text-align: center; font-weight: bold; margin-top: 1rem; font-size: 1.1rem;"></div>
            </div>

            <!-- WAITING / INTERMISSION & LIVE LEADERBOARD VIEW -->
            <div id="waitingContainer" style="text-align: center; padding: 1rem 0;">
                <h3 style="color: var(--neon-yellow);" id="waitingTitle">⏳ Get Ready!</h3>
                <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem;" id="waitingSubtext">You are in the waiting room. The host will start shortly.</p>
                
                <div id="miniLeaderboardBox" style="background: rgba(0,0,0,0.4); border: 1px solid rgba(0,243,255,0.2); border-radius: 8px; padding: 0.75rem; text-align: left;">
                    <strong style="color: var(--neon-blue); font-size: 0.85rem; display: block; margin-bottom: 0.5rem;">🏆 Live Standings</strong>
                    <div id="miniLeaderboardList" style="font-size: 0.85rem; color: var(--text-muted);">Waiting for scores...</div>
                </div>
            </div>
        </div>

        <!-- LOBBY POLL CARD -->
        <div id="pollCard" class="card">
            <h3 id="pollQuestionTitle">📊 Live Crowd Poll</h3>
            <div id="pollOptionsContainer"></div>
        </div>

        <!-- FLOATING EMOJI BAR -->
        <div class="card" style="padding: 0.75rem;">
            <div class="emoji-bar">
                <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="sendEmoji('🍻')">🍻</button>
                <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
                <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="sendEmoji('🎉')">🎉</button>
                <button class="emoji-btn" onclick="sendEmoji('💡')">💡</button>
            </div>
        </div>

        <!-- PLAYER CHAT CARD -->
        <div class="card">
            <h3>💬 Live Table Chat</h3>
            <div id="chatFeed" class="chat-feed"></div>
            <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="chatInput" placeholder="Send message to room..." style="margin-bottom: 0;" onkeypress="if(event.key==='Enter') sendChat()">
                <button class="btn-blue" style="width: 80px;" onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let myName = '';
        let currentTimerValue = 15;
        let hasVotedCurrentPoll = false;

        function joinGame() {
            const input = document.getElementById('playerNameInput');
            myName = input.value.trim();
            if (!myName) {
                alert('Please enter a team name.');
                return;
            }
            socket.emit('player-join', myName);
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('gameCard').classList.remove('hidden');
            document.getElementById('playerWelcomeHeader').innerText = myName;
        }

        socket.on('state-update', (state) => {
            // Update score and Mini Leaderboard
            if (state.scores) {
                const scoresArr = Object.values(state.scores).sort((a, b) => b.score - a.score);
                const me = scoresArr.find(p => p.name === myName);
                if (me) {
                    document.getElementById('playerScoreDisplay').innerText = me.score;
                }

                const lbList = document.getElementById('miniLeaderboardList');
                if (scoresArr.length > 0) {
                    lbList.innerHTML = scoresArr.slice(0, 5).map((p, idx) => `
                        <div style="display: flex; justify-content: space-between; padding: 2px 0; ${p.name === myName ? 'color: var(--neon-green); font-weight: bold;' : ''}">
                            <span>${idx + 1}. ${p.name}</span>
                            <span>${p.score} pts</span>
                        </div>
                    `).join('');
                } else {
                    lbList.innerHTML = 'No scores recorded yet.';
                }
            }

            // Update Poll & Results View
            if (state.lobbySettings && state.lobbySettings.showPoll) {
                document.getElementById('pollCard').classList.remove('hidden');
                document.getElementById('pollQuestionTitle').innerText = '📊 ' + state.lobbySettings.pollQuestion;
                const pollOpts = document.getElementById('pollOptionsContainer');
                
                const votes = state.lobbySettings.votes || {};
                const totalVotes = Object.keys(votes).length;

                if (!hasVotedCurrentPoll) {
                    // Show clickable voting options
                    pollOpts.innerHTML = state.lobbySettings.pollOptions.map(opt => `
                        <button class="btn-option" style="text-align: center; margin-bottom: 0.4rem;" onclick="votePoll('${opt}')">${opt}</button>
                    `).join('');
                } else {
                    // Show live vote results breakdown
                    const counts = {};
                    state.lobbySettings.pollOptions.forEach(opt => counts[opt] = 0);
                    Object.values(votes).forEach(v => { if (counts[v] !== undefined) counts[v]++; });

                    pollOpts.innerHTML = state.lobbySettings.pollOptions.map(opt => {
                        const count = counts[opt] || 0;
                        const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                        return `
                            <div style="margin-bottom: 0.5rem; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px;">
                                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 2px;">
                                    <span>${opt}</span>
                                    <span>${count} votes (${pct}%)</span>
                                </div>
                                <div style="background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; overflow: hidden;">
                                    <div style="background: var(--neon-blue); width: ${pct}%; height: 100%;"></div>
                                </div>
                            </div>
                        `;
                    }).join('') + `<p style="text-align: center; font-size: 0.75rem; color: var(--neon-green); margin-top: 6px;">✓ Vote recorded!</p>`;
                }
            } else {
                document.getElementById('pollCard').classList.add('hidden');
                hasVotedCurrentPoll = false; // Reset when poll changes
            }

            // Game Status
            const qContainer = document.getElementById('questionContainer');
            const wContainer = document.getElementById('waitingContainer');

            if (state.status === 'QUESTION' && state.playlist[state.currentRoundIndex]) {
                wContainer.classList.add('hidden');
                qContainer.classList.remove('hidden');

                const round = state.playlist[state.currentRoundIndex];
                const q = round.questions[state.currentQuestionIndex];
                if (q) {
                    document.getElementById('questionText').innerText = q.question;
                    const optsBox = document.getElementById('optionsContainer');
                    
                    if (q.options && q.options.length > 0) {
                        optsBox.innerHTML = q.options.map(opt => `
                            <button class="btn-option" onclick="submitAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</button>
                        `).join('');
                    } else {
                        optsBox.innerHTML = `
                            <input type="text" id="textAnswerInput" placeholder="Type your answer...">
                            <button class="btn-blue" onclick="submitTextAnswer()">Submit Answer</button>
                        `;
                    }
                }
            } else {
                qContainer.classList.add('hidden');
                wContainer.classList.remove('hidden');
                document.getElementById('answerFeedback').innerText = '';
                
                const wTitle = document.getElementById('waitingTitle');
                const wSub = document.getElementById('waitingSubtext');

                if (state.status === 'INTERMISSION') {
                    wTitle.innerText = '☕ Round Complete!';
                    wSub.innerText = 'Check out the live standings below while waiting for the next round.';
                } else if (state.status === 'LEADERBOARD') {
                    wTitle.innerText = '🏆 Game Over!';
                    wSub.innerText = 'Final standings are on the big screen!';
                } else {
                    wTitle.innerText = '⏳ Waiting Room';
                    wSub.innerText = 'You are locked in and ready. The host will start shortly.';
                }
            }
        });

        socket.on('timer-tick', (timeLeft) => {
            currentTimerValue = timeLeft;
            const tDisplay = document.getElementById('timerDisplay');
            if (tDisplay) tDisplay.innerText = timeLeft + 's';
        });

        function submitAnswer(ans) {
            document.getElementById('optionsContainer').innerHTML = `<p style="color: var(--neon-green); text-align:center; font-weight:bold;">Answer submitted: "${ans}"</p>`;
            socket.emit('submit-answer', { answer: ans, timeRemaining: currentTimerValue });
        }

        function submitTextAnswer() {
            const val = document.getElementById('textAnswerInput').value.trim();
            if (!val) return;
            submitAnswer(val);
        }

        socket.on('answer-result', (res) => {
            const fb = document.getElementById('answerFeedback');
            if (res.correct) {
                fb.innerHTML = `<span style="color: var(--neon-green);">✅ Correct! +${res.points} pts</span>`;
            } else {
                fb.innerHTML = `<span style="color: var(--neon-red);">❌ Incorrect. Correct was: ${res.correctAnswer}</span>`;
            }
        });

        function votePoll(option) {
            hasVotedCurrentPoll = true;
            socket.emit('poll-vote', option);
        }

        function sendEmoji(emoji) {
            triggerFloatingEmoji(emoji);
        }

        function triggerFloatingEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emoji;
            el.style.left = (Math.random() * 80 + 10) + '%';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            socket.emit('player-chat', text);
            input.value = '';
        }

        socket.on('chat-message', (msg) => {
            const feed = document.getElementById('chatFeed');
            if (feed) {
                feed.innerHTML += `<div><strong>${msg.name}:</strong> ${msg.text}</div>`;
                feed.scrollTop = feed.scrollHeight;
            }
        });
    </script>
</body>
</html>
