<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaMania - Mobile Player</title>
    <style>
        :root { 
            --bg: #0d0e15; --card: #161824; --primary: #7c3aed; 
            --accent: #06b6d4; --text: #f3f4f6; --muted: #9ca3af;
            --border: #272a3b; --success: #10b981;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; box-sizing: border-box; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 10px 0 20px 0; background: #10121a; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 14px; font-weight: bold; border: none; border-radius: 8px; background: var(--primary); color: white; font-size: 16px; cursor: pointer; }
        
        /* Mobile Advert Overlay */
        #mobileAdvertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 14, 21, 0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        #mobileAdvertOverlay h2 { color: var(--accent); font-size: 28px; margin-bottom: 15px; }
        #mobileAdvertOverlay img { max-width: 100%; max-height: 300px; border-radius: 10px; border: 2px solid var(--accent); }

        /* Poll Modal */
        #pollModal { display: none; background: #1e2130; border: 2px solid var(--accent); padding: 15px; border-radius: 10px; margin-top: 20px; }
        .poll-btn { background: #272a3b; border: 1px solid var(--accent); color: white; padding: 10px; margin: 5px 0; border-radius: 6px; width: 100%; cursor: pointer; font-size: 14px; }
        .poll-btn:hover { background: var(--accent); color: #000; }
    </style>
</head>
<body>

    <h1>📱 TriviaMania Player</h1>

    <div class="panel" id="loginPanel">
        <h2>Join the Game</h2>
        <label>Enter Your Team Name:</label>
        <input type="text" id="teamNameInput" placeholder="e.g. The Quizly Bears">
        <button onclick="joinGame()">🚀 Join Game</button>
    </div>

    <div class="panel" id="gamePanel" style="display:none;">
        <h2 id="welcomeTeam">Welcome!</h2>
        <p style="color: var(--muted);">Waiting for the next question to appear...</p>
        
        <!-- Live Icebreaker Poll Container -->
        <div id="pollModal">
            <h3 id="pollQuestionText" style="color: var(--accent); margin-top:0;">Icebreaker Poll</h3>
            <div id="pollOptionsContainer"></div>
        </div>
    </div>

    <!-- Mobile Ad Overlay -->
    <div id="mobileAdvertOverlay">
        <h2 id="mobAdTitle">Sponsor Advert</h2>
        <img id="mobAdImage" src="" alt="Sponsor" style="display:none;">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function joinGame() {
            const name = document.getElementById('teamNameInput').value.trim();
            if (!name) return alert('Please enter a team name!');
            
            socket.emit('joinGame', { name: name, avatar: '🎯' });
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('gamePanel').style.display = 'block';
            document.getElementById('welcomeTeam').textContent = 'Team: ' + name;
        }

        socket.on('advertUpdate', function(advert) {
            const overlay = document.getElementById('mobileAdvertOverlay');
            const titleEl = document.getElementById('mobAdTitle');
            const imgEl = document.getElementById('mobAdImage');

            if (advert.active && (advert.target === 'both' || advert.target === 'mobile')) {
                titleEl.textContent = advert.title;
                if (advert.image) {
                    imgEl.src = advert.image;
                    imgEl.style.display = 'block';
                } else {
                    imgEl.style.display = 'none';
                }
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        });

        socket.on('pollUpdate', function(poll) {
            const modal = document.getElementById('pollModal');
            const qText = document.getElementById('pollQuestionText');
            const optsContainer = document.getElementById('pollOptionsContainer');

            if (poll.active) {
                qText.textContent = poll.question;
                optsContainer.innerHTML = '';
                poll.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'poll-btn';
                    btn.textContent = opt;
                    btn.onclick = function() {
                        alert('Vote registered for: ' + opt);
                        modal.style.display = 'none';
                    };
                    optsContainer.appendChild(btn);
                });
                modal.style.display = 'block';
            } else {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
