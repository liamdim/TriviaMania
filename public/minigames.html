<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Mini-Games Studio</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --neon-pink: #ff0055;
            --neon-blue: #00f3ff;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #05050a 70%); }
        header { background: rgba(10, 15, 30, 0.9); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 0, 85, 0.3); }
        header h1 { font-size: 1.5rem; color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
        .nav-links { display: flex; gap: 0.75rem; }
        .nav-links a { color: var(--neon-blue); text-decoration: none; padding: 0.5rem 1rem; background: rgba(0, 243, 255, 0.1); border-radius: 6px; border: 1px solid rgba(0, 243, 255, 0.3); font-size: 0.9rem; }
        .container { flex: 1; padding: 2rem; max-width: 900px; width: 100%; margin: 0 auto; }
        .card { background: var(--panel-bg); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(255, 0, 85, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        .card h3 { margin-bottom: 1rem; color: var(--neon-pink); font-weight: 600; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        select, input { width: 100%; padding: 0.75rem; background: rgba(5, 10, 20, 0.8); border: 1px solid rgba(255, 0, 85, 0.3); color: white; border-radius: 6px; margin-bottom: 0.5rem; }
        button { background: linear-gradient(135deg, #aa0033, #ff0055); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Game Shows & Mini-Games Studio</h1>
        <div class="nav-links">
            <a href="/index.html">⚡ Live Controls</a>
        </div>
    </header>
    <div class="container">
        <div class="card">
            <h3>Generate Mini-Game Round</h3>
            <div class="form-group">
                <label>Select Game Mode:</label>
                <select id="miniGameTypeSelect">
                    <option value="lingo">🔤 LINGO (5-Letter Word Guessing Game)</option>
                    <option value="scramble">🔀 WORD SCRAMBLE (Anagram Speed Race)</option>
                    <option value="higher-lower">⬆️ HIGHER OR LOWER (Statistics Prediction)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Round Name:</label>
                <input type="text" id="miniGameRoundName" value="Lingo Word Game Round">
            </div>
            <div class="form-group">
                <label>Number of Puzzles:</label>
                <select id="miniGameCount">
                    <option value="3">3 Puzzles</option>
                    <option value="5" selected>5 Puzzles</option>
                    <option value="8">8 Puzzles</option>
                </select>
            </div>
            <button onclick="addMiniGameRoundToPlaylist()">➕ Add Mini-Game Round to Active Queue</button>
        </div>
    </div>
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        function addMiniGameRoundToPlaylist() {
            const type = document.getElementById('miniGameTypeSelect').value;
            const name = document.getElementById('miniGameRoundName').value;
            const count = parseInt(document.getElementById('miniGameCount').value);
            socket.emit('add-minigame-round', { type, name, count });
            alert('Mini-game round added to game queue!');
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
