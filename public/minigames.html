<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Mini-Game Studio</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-red: #ff0055;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #05050a 70%); padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: rgba(10, 15, 30, 0.9); padding: 1rem 2rem; border-radius: 8px; border: 1px solid rgba(0, 243, 255, 0.3); }
        header h1 { color: var(--neon-blue); font-size: 1.5rem; }
        .container { max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .card { background: var(--panel-bg); border-radius: 12px; padding: 1.5rem; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        select, input[type="text"] { width: 100%; padding: 0.75rem; background: rgba(5, 10, 20, 0.9); border: 1px solid rgba(0, 243, 255, 0.4); color: white; border-radius: 6px; margin-bottom: 0.75rem; font-size: 1rem; }
        button { padding: 0.75rem 1.2rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; width: 100%; }
        button:hover { filter: brightness(1.2); }
        .btn-green { background: linear-gradient(135deg, #00aa44, var(--neon-green)); color: #000; }
        .btn-blue { background: linear-gradient(135deg, #0077ff, var(--neon-blue)); color: white; }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Mini-Game Studio (Higher/Lower & Scramble)</h1>
        <a href="/" style="color: var(--neon-blue); text-decoration: none; font-weight: bold;">← Back to Host Control</a>
    </header>

    <div class="container">
        <div class="card">
            <h3 style="color: var(--neon-blue); margin-bottom: 1rem;">Generate Interactive Mini-Game Round</h3>
            
            <label style="color: var(--text-muted); display: block; margin-bottom: 0.3rem;">Game Type:</label>
            <select id="gameTypeSelect">
                <option value="higher-lower">⬆️ Higher or Lower (Stat Duel)</option>
                <option value="scramble">🔀 Word Scramble</option>
                <option value="lingo">🔤 Lingo (5-Letter Guess)</option>
            </select>

            <label style="color: var(--text-muted); display: block; margin-bottom: 0.3rem; margin-top: 0.75rem;">Round Title:</label>
            <input type="text" id="roundTitleInput" value="Stat Duel: Higher or Lower">

            <label style="color: var(--text-muted); display: block; margin-bottom: 0.3rem; margin-top: 0.75rem;">Number of Questions:</label>
            <select id="questionCountSelect">
                <option value="5">5 Questions</option>
                <option value="10" selected>10 Questions</option>
                <option value="15">15 Questions</option>
            </select>

            <button class="btn-green" style="margin-top: 1rem;" onclick="generateMiniGame()">⚡ Generate & Add to Game Queue</button>
        </div>
    </div>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });

        function generateMiniGame() {
            const type = document.getElementById('gameTypeSelect').value;
            const name = document.getElementById('roundTitleInput').value.trim();
            const count = document.getElementById('questionCountSelect').value;

            alert('Generating mini-game questions with AI... This will take just a few seconds.');
            socket.emit('add-minigame-round', { type, name, count });
        }

        socket.on('minigame-added', (res) => {
            if (res.success) {
                alert('Mini-game successfully added to your live game queue!');
                window.location.href = '/';
            } else {
                alert('Error: ' + (res.error || 'Failed to generate mini-game.'));
            }
        });
    </script>
</body>
</html>
