<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Standard Quiz Builder</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --neon-blue: #00f3ff;
            --neon-yellow: #ffee00;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #05050a 70%); }
        header { background: rgba(10, 15, 30, 0.9); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 243, 255, 0.3); }
        header h1 { font-size: 1.5rem; color: var(--neon-blue); }
        .nav-links { display: flex; gap: 0.75rem; }
        .nav-links a { color: var(--neon-blue); text-decoration: none; padding: 0.5rem 1rem; background: rgba(0, 243, 255, 0.1); border-radius: 6px; border: 1px solid rgba(0, 243, 255, 0.3); font-size: 0.9rem; }
        .container { flex: 1; padding: 2rem; max-width: 900px; width: 100%; margin: 0 auto; }
        .card { background: var(--panel-bg); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        .card h3 { margin-bottom: 1rem; color: var(--neon-blue); font-weight: 600; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        select, input { width: 100%; padding: 0.75rem; background: rgba(5, 10, 20, 0.8); border: 1px solid rgba(0, 243, 255, 0.3); color: white; border-radius: 6px; margin-bottom: 0.5rem; }
        button { background: linear-gradient(135deg, #0077ff, #00f3ff); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
        button.success { background: linear-gradient(135deg, #00aa44, #00ff66); color: #000; }
    </style>
</head>
<body>
    <header>
        <h1>📂 Standard Quiz Playlist Builder</h1>
        <div class="nav-links">
            <a href="/index.html">⚡ Live Controls</a>
        </div>
    </header>
    <div class="container">
        <div class="card">
            <h3>Add Standard Quiz Round</h3>
            <div class="form-group">
                <label>Select Category (Loaded from GitHub):</label>
                <select id="triviaGenreSelect">
                    <option value="">Loading categories...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Round Custom Name:</label>
                <input type="text" id="roundNameInput" value="General Knowledge Round">
            </div>
            <div class="form-group">
                <label>Question Count:</label>
                <select id="questionCountSelect">
                    <option value="5">5 Questions</option>
                    <option value="10" selected>10 Questions</option>
                    <option value="15">15 Questions</option>
                    <option value="20">20 Questions</option>
                </select>
            </div>
            <button class="success" onclick="addRoundToPlaylist()">➕ Add Round to Active Game Queue</button>
        </div>
    </div>
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });

        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                const categories = await res.json();
                const select = document.getElementById('triviaGenreSelect');
                if (categories.length > 0) {
                    select.innerHTML = categories.map(cat => '<option value="' + cat + '">' + cat.replace(/-/g, ' ').toUpperCase() + '</option>').join('');
                } else {
                    select.innerHTML = '<option value="">No categories found. Add text files to /categories/</option>';
                }
            } catch (err) {
                console.error(err);
            }
        }
        loadCategories();

        function addRoundToPlaylist() {
            const genre = document.getElementById('triviaGenreSelect').value;
            const name = document.getElementById('roundNameInput').value;
            const count = parseInt(document.getElementById('questionCountSelect').value);
            if (!genre) { alert('Please select a category!'); return; }
            socket.emit('add-round', { genre, name, count });
            alert('Standard round added to game playlist queue!');
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
