<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Projector Display</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 2rem; background-image: radial-gradient(circle at 50% 50%, #1a103c 0%, #05050a 80%); overflow: hidden; text-align: center; }
        header { font-size: 2rem; color: var(--neon-blue); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem; text-shadow: 0 0 20px rgba(0,243,255,0.4); }
        .main-container { width: 100%; max-width: 1000px; background: var(--panel-bg); border-radius: 16px; padding: 3rem; border: 2px solid rgba(0, 243, 255, 0.4); box-shadow: 0 12px 40px rgba(0,0,0,0.6); margin: auto; }
        .question-text { font-size: 2.5rem; margin-bottom: 2rem; font-weight: 600; line-height: 1.3; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .option-card { background: rgba(5, 10, 20, 0.8); border: 2px solid rgba(0, 243, 255, 0.3); padding: 1.5rem; border-radius: 10px; font-size: 1.5rem; font-weight: bold; color: var(--text); }
        .timer-bar-container { width: 100%; background: rgba(255,255,255,0.1); height: 12px; border-radius: 6px; margin-top: 2rem; overflow: hidden; }
        .timer-bar { width: 100%; height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-green)); transition: width 1s linear; }
        #audioPlayerContainer { display: none; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <header id="headerTitle">TriviaMania Live</header>

    <div class="main-container" id="mainDisplayCard">
        <div id="contentArea">
            <h2 class="question-text" id="displayQuestion">Waiting for host to start the game...</h2>
            <div class="options-grid" id="displayOptions"></div>
        </div>
        
        <div class="timer-bar-container" id="timerBarContainer" style="display: none;">
            <div class="timer-bar" id="timerBar"></div>
        </div>

        <!-- Embedded YouTube Audio / Video Player -->
        <div id="audioPlayerContainer">
            <div id="youtubePlayer"></div>
        </div>
    </div>

    <footer style="color: var(--text-muted); font-size: 1.1rem;" id="venueFooter">Get your phones ready to play!</footer>

    <!-- YouTube IFrame API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let player;
        let apiReady = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtubePlayer', {
                height: '180',
                width: '320',
                videoId: '',
                playerVars: { 'autoplay': 1, 'controls': 1 },
                events: {
                    'onReady': () => { apiReady = true; }
                }
            });
        }

        socket.on('state-update', (state) => {
            document.getElementById('venueFooter').innerText = state.venueDetails || 'Get your phones ready to play!';
            document.getElementById('headerTitle').innerText = state.welcomeHeader || 'TriviaMania Live';

            if (state.status === 'QUESTION') {
                const round = state.playlist[state.currentRoundIndex];
                if (round && round.questions) {
                    const q = round.questions[state.currentQuestionIndex];
                    if (q) {
                        document.getElementById('displayQuestion').innerText = q.question;
                        
                        const optionsGrid = document.getElementById('displayOptions');
                        if (q.options && q.options.length > 0) {
                            optionsGrid.style.display = 'grid';
                            optionsGrid.innerHTML = q.options.map(opt => `<div class="option-card">${opt}</div>`).join('');
                        } else {
                            optionsGrid.style.display = 'none';
                        }

                        document.getElementById('timerBarContainer').style.display = 'block';
                        
                        // Check if question contains a YouTube link or search query for audio
                        if (q.youtubeId && apiReady) {
                            document.getElementById('audioPlayerContainer').style.display = 'block';
                            player.loadVideoById(q.youtubeId);
                        }
                    }
                }
            } else if (state.status === 'LEADERBOARD') {
                document.getElementById('displayQuestion').innerText = '🏆 FINAL LEADERBOARD 🏆';
                document.getElementById('displayOptions').innerHTML = '';
                document.getElementById('timerBarContainer').style.display = 'none';
                stopAudio();
            } else if (state.status === 'IDLE' || state.status === 'PAUSED') {
                document.getElementById('displayQuestion').innerText = state.welcomeHeader || 'Waiting for host to start game...';
                document.getElementById('displayOptions').innerHTML = '';
                document.getElementById('timerBarContainer').style.display = 'none';
                stopAudio();
            }
        });

        socket.on('timer-tick', (timeLeft) => {
            const stateMax = 15; // fallback
            const pct = (timeLeft / stateMax) * 100;
            const bar = document.getElementById('timerBar');
            if (bar) bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
        });

        socket.on('stop-audio', () => {
            stopAudio();
        });

        function stopAudio() {
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
            const container = document.getElementById('audioPlayerContainer');
            if (container) container.style.display = 'none';
        }
    </script>
</body>
</html>
