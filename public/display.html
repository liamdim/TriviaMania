<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaMania - Projector Display</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 1rem; }
        .venue-title { font-size: 1.5rem; color: var(--accent); font-weight: bold; }
        .timer-box { font-size: 2.5rem; font-weight: bold; background: var(--panel-bg); padding: 0.5rem 1.5rem; border-radius: 12px; border: 2px solid #475569; }
        
        .main-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; }
        .question-text { font-size: 2.5rem; margin-bottom: 2rem; line-height: 1.3; max-width: 900px; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; width: 100%; max-width: 900px; }
        .option-card { background: var(--panel-bg); border: 2px solid #475569; padding: 1.5rem; border-radius: 12px; font-size: 1.5rem; font-weight: 600; color: white; }
        
        .leaderboard-table { width: 100%; max-width: 800px; margin: 0 auto; border-collapse: collapse; background: var(--panel-bg); border-radius: 12px; overflow: hidden; border: 2px solid #475569; }
        .leaderboard-table th, .leaderboard-table td { padding: 1rem; text-align: center; font-size: 1.2rem; border-bottom: 1px solid #334155; }
        .leaderboard-table th { background: #0f172a; color: var(--accent); }
    </style>
</head>
<body>

    <audio id="projectorAudioPlayer" preload="auto"></audio>

    <div class="header">
        <div id="venueDisplay" class="venue-title">Welcome to Trivia Night!</div>
        <div id="timerDisplay" class="timer-box">--</div>
    </div>

    <div class="main-stage" id="mainStage">
        <h2>Waiting for host to start the game...</h2>
    </div>

    <script>
        const socket = io();
        let lastPlayedQKey = null;

        // Instantly kill audio when stop or reset is triggered by host
        socket.on('stop-audio', () => {
            const audio = document.getElementById('projectorAudioPlayer');
            audio.pause();
            audio.currentTime = 0;
            lastPlayedQKey = null;
        });

        socket.on('timer-tick', (timeLeft) => {
            document.getElementById('timerDisplay').innerText = timeLeft;
        });

        socket.on('state-update', (state) => {
            if (state.venueDetails) {
                document.getElementById('venueDisplay').innerText = state.venueDetails;
            }

            const stage = document.getElementById('mainStage');
            const timerBox = document.getElementById('timerDisplay');

            if (state.status === 'IDLE') {
                timerBox.innerText = '--';
                stage.innerHTML = `<h1>Welcome to TriviaMania!</h1><p style="color: var(--text-muted); font-size: 1.5rem; margin-top: 1rem;">Waiting for host to launch the game...</p>`;
            } else if (state.status === 'QUESTION') {
                timerBox.innerText = state.timer;
                const round = state.playlist[state.currentRoundIndex];
                const q = round ? round.questions[state.currentQuestionIndex] : null;

                if (q) {
                    if (q.audioPreviewUrl) {
                        const audio = document.getElementById('projectorAudioPlayer');
                        const uniqueKey = `${state.currentRoundIndex}-${state.currentQuestionIndex}`;
                        
                        if (lastPlayedQKey !== uniqueKey) {
                            lastPlayedQKey = uniqueKey;
                            audio.src = q.audioPreviewUrl;
                            audio.load();
                            audio.play().catch(err => console.log("Projector autoplay blocked"));
                        }
                    }

                    stage.innerHTML = `
                        <div class="question-text">${q.question}</div>
                        <div class="options-grid">
                            ${q.options.map(opt => `<div class="option-card">${opt}</div>`).join('')}
                        </div>
                    `;
                }
            } else if (state.status === 'LEADERBOARD') {
                timerBox.innerText = '☕';
                const audio = document.getElementById('projectorAudioPlayer');
                audio.pause();

                const players = Object.values(state.scores || {}).sort((a, b) => b.score - a.score);
                stage.innerHTML = `
                    <h2 style="font-size: 2.5rem; margin-bottom: 1.5rem; color: var(--accent);">🏆 Leaderboard Standings</h2>
                    <table class="leaderboard-table">
                        <thead><tr><th>Rank</th><th>Player</th><th>Streak</th><th>Score</th></tr></thead>
                        <tbody>
                            ${players.length === 0 ? '<tr><td colspan="4">No scores yet</td></tr>' : 
                                players.map((p, idx) => `<tr><td>${idx+1}</td><td>${p.name}</td><td>🔥 x${p.streak || 0}</td><td><strong>${p.score}</strong></td></tr>`).join('')}
                        </tbody>
                    </table>
                `;
            } else if (state.status === 'PAUSED') {
                timerBox.innerText = '⏸';
                const audio = document.getElementById('projectorAudioPlayer');
                audio.pause();
                stage.innerHTML = `<h1>Game Paused by Host</h1>`;
            }
        });
    </script>
</body>
</html>
