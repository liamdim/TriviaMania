<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Projector Display</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-red: #ff0055;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; background-image: radial-gradient(circle at 50% 30%, #1a103c 0%, #05050a 80%); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(0, 243, 255, 0.3); padding-bottom: 1rem; }
        header h1 { font-size: 2.5rem; color: var(--neon-blue); letter-spacing: 2px; }
        .main-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1rem; position: relative; }
        
        /* Idle / Waiting Screen Layout */
        #idleScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; width: 100%; max-width: 900px; }
        .idle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; width: 100%; align-items: center; margin-top: 1rem; }
        .idle-box { background: var(--panel-bg); border: 2px solid rgba(0, 243, 255, 0.4); border-radius: 16px; padding: 2rem; box-shadow: 0 0 30px rgba(0, 243, 255, 0.15); text-align: center; }

        /* Question Display Styles */
        #questionCard { background: var(--panel-bg); border: 2px solid var(--neon-blue); border-radius: 16px; padding: 2.5rem; max-width: 900px; width: 100%; box-shadow: 0 0 40px rgba(0, 243, 255, 0.2); }
        #questionText { font-size: 2.2rem; margin-bottom: 1.5rem; line-height: 1.4; }
        
        /* Picture Round Image Styling on Projector */
        #projectorImageContainer { margin-top: 1.5rem; margin-bottom: 1.5rem; display: none; }
        #projectorImageContainer img { max-height: 380px; max-width: 100%; border-radius: 12px; border: 3px solid var(--neon-blue); box-shadow: 0 0 25px rgba(0,243,255,0.4); }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem; }
        .option-box { background: rgba(0, 243, 255, 0.1); border: 2px solid rgba(0, 243, 255, 0.4); padding: 1.2rem; border-radius: 10px; font-size: 1.5rem; font-weight: bold; }

        /* Floating Emojis */
        .floating-emoji { position: absolute; font-size: 3rem; animation: floatUp 3s linear forwards; pointer-events: none; z-index: 100; }
        @keyframes floatUp { 0% { bottom: 0; opacity: 1; transform: scale(0.5); } 50% { transform: scale(1.2) rotate(15deg); } 100% { bottom: 80vh; opacity: 0; transform: scale(1) rotate(-15deg); } }

        footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(0, 243, 255, 0.2); padding-top: 1rem; font-size: 1.2rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <header>
        <h1 id="brandHeader">⚡ TriviaMania</h1>
        <div id="timerClock" style="font-size: 2.5rem; color: var(--neon-yellow); font-weight: bold;">15s</div>
    </header>

    <div class="main-stage" id="stageContainer">
        <!-- IDLE / WAITING SCREEN (With QR Code & Lobby Poll) -->
        <div id="idleScreen">
            <h2 id="welcomeHeaderDisplay" style="font-size: 3rem; color: var(--neon-green); margin-bottom: 0.5rem;">Welcome to TriviaMania!</h2>
            <p id="venueDetailsDisplay" style="font-size: 1.5rem; color: var(--text-muted); margin-bottom: 1rem;">Scan QR code or open controller to join!</p>
            
            <div class="idle-grid">
                <!-- QR Code Box -->
                <div class="idle-box" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <h3 style="color: var(--neon-blue); margin-bottom: 1rem; font-size: 1.4rem;">📱 Scan to Join Game</h3>
                    <div id="qrcode" style="background: white; padding: 12px; border-radius: 10px; display: inline-block;"></div>
                </div>

                <!-- Lobby Poll Box -->
                <div class="idle-box" id="projectorPollBox" style="display: none; text-align: left;">
                    <h3 style="color: var(--neon-yellow); margin-bottom: 0.75rem; font-size: 1.3rem; text-align: center;" id="projectorPollQ">Live Room Poll</h3>
                    <div id="projectorPollResults" style="display: flex; flex-direction: column; gap: 0.6rem;"></div>
                </div>
            </div>
        </div>

        <!-- ACTIVE QUESTION / PICTURE SCREEN -->
        <div id="questionCard" style="display: none;">
            <div id="qRoundCounter" style="color: var(--neon-yellow); font-size: 1.2rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px;">Round 1 // Question 1</div>
            <h2 id="questionText">Question text goes here...</h2>
            
            <!-- Picture element rendered here when [IMG:...] is present -->
            <div id="projectorImageContainer">
                <img id="projectorImg" src="" alt="Picture Round Image">
            </div>

            <div class="options-grid" id="projectorOptionsGrid"></div>
        </div>
    </div>

    <footer>
        <span id="connectedCount">Players Connected: 0</span>
        <span id="venueFooter">Trivia Night Live</span>
    </footer>

    <!-- QR Code Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });

        // Generate QR code for mobile joining
        const joinUrl = window.location.origin + '/player.html';
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
            text: joinUrl,
            width: 160,
            height: 160,
            colorDark: "#05050a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        socket.on('state-update', (state) => {
            document.getElementById('brandHeader').innerText = state.welcomeHeader || '⚡ TriviaMania';
            document.getElementById('venueDetailsDisplay').innerText = state.venueDetails || '';
            document.getElementById('venueFooter').innerText = state.venueDetails || 'Trivia Night Live';

            const playerCount = Object.keys(state.scores || {}).length;
            document.getElementById('connectedCount').innerText = `Players Connected: ${playerCount}`;

            if (state.status === 'QUESTION') {
                document.getElementById('idleScreen').style.display = 'none';
                document.getElementById('questionCard').style.display = 'block';

                const round = state.playlist[state.currentRoundIndex];
                if (round && round.questions) {
                    const q = round.questions[state.currentQuestionIndex];
                    if (q) {
                        document.getElementById('qRoundCounter').innerText = `Round ${state.currentRoundIndex + 1} (${round.name}) // Q ${state.currentQuestionIndex + 1}`;
                        
                        // Check if question contains a picture tag [IMG:url]
                        const rawQText = q.question || '';
                        const imgMatch = rawQText.match(/\[IMG:(.*?)\]/);
                        
                        if (imgMatch) {
                            const imgUrl = imgMatch[1];
                            const cleanText = rawQText.replace(/\[IMG:.*?\]/, '').trim();
                            
                            document.getElementById('questionText').innerText = cleanText;
                            document.getElementById('projectorImg').src = imgUrl;
                            document.getElementById('projectorImageContainer').style.display = 'block';
                        } else {
                            document.getElementById('questionText').innerText = rawQText;
                            document.getElementById('projectorImageContainer').style.display = 'none';
                        }

                        const optionsGrid = document.getElementById('projectorOptionsGrid');
                        if (q.options && q.options.length > 0) {
                            optionsGrid.style.display = 'grid';
                            optionsGrid.innerHTML = q.options.map((opt, idx) => `
                                <div class="option-box">${['A', 'B', 'C', 'D'][idx]}. ${opt}</div>
                            `).join('');
                        } else {
                            optionsGrid.style.display = 'none';
                        }
                    }
                }
            } else {
                document.getElementById('idleScreen').style.display = 'flex';
                document.getElementById('questionCard').style.display = 'none';

                // Render Lobby Poll on projector if active
                if (state.lobbySettings && state.lobbySettings.showPoll) {
                    document.getElementById('projectorPollBox').style.display = 'block';
                    document.getElementById('projectorPollQ').innerText = state.lobbySettings.pollQuestion;

                    const votes = state.lobbySettings.votes || {};
                    const totalVotes = Object.keys(votes).length;
                    const counts = {};
                    state.lobbySettings.pollOptions.forEach(opt => counts[opt] = 0);
                    Object.values(votes).forEach(val => { if (counts[val] !== undefined) counts[val]++; });

                    const resultsContainer = document.getElementById('projectorPollResults');
                    resultsContainer.innerHTML = state.lobbySettings.pollOptions.map(opt => {
                        const c = counts[opt] || 0;
                        const p = totalVotes > 0 ? Math.round((c / totalVotes) * 100) : 0;
                        return `
                            <div style="background: rgba(0,243,255,0.1); padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid rgba(0,243,255,0.3);">
                                <div style="display:flex; justify-content:space-between; font-size:1.1rem; margin-bottom:0.3rem; font-weight:bold;">
                                    <span>${opt}</span>
                                    <span style="color:var(--neon-green);">${p}% (${c} votes)</span>
                                </div>
                                <div style="background:rgba(0,0,0,0.5); height:8px; border-radius:4px; overflow:hidden;">
                                    <div style="background:var(--neon-blue); width:${p}%; height:100%; transition: width 0.3s;"></div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    document.getElementById('projectorPollBox').style.display = 'none';
                }
            }
        });

        socket.on('timer-tick', (timeLeft) => {
            document.getElementById('timerClock').innerText = timeLeft + 's';
        });

        socket.on('trigger-floating-emoji', (emoji) => {
            const stage = document.getElementById('stageContainer');
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emoji;
            el.style.left = Math.random() * 80 + 10 + 'vw';
            stage.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        });
    </script>
</body>
</html>
