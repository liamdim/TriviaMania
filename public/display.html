<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Big Screen Projector</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-red: #ff0055;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 2.5rem; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; background-image: radial-gradient(circle at 50% 20%, #1a103c 0%, #05050a 80%); }
        header { text-align: center; margin-bottom: 1.5rem; }
        header h1 { color: var(--neon-blue); font-size: 2.8rem; margin-bottom: 0.3rem; text-shadow: 0 0 20px rgba(0,243,255,0.4); }
        header p { color: var(--text-muted); font-size: 1.3rem; }
        .main-stage { flex: 1; display: flex; justify-content: center; align-items: center; }
        .card { background: var(--panel-bg); border-radius: 16px; padding: 2.5rem; border: 2px solid rgba(0, 243, 255, 0.4); box-shadow: 0 12px 48px rgba(0,0,0,0.6); max-width: 1000px; width: 100%; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <h1 id="welcomeHeaderDisplay">Welcome to TriviaMania!</h1>
        <p id="venueDetailsDisplay">Get your phones ready to play!</p>
    </header>

    <div class="main-stage">
        <div id="projectorCard" class="card">
            <h2 id="projectorTitle" style="color: var(--neon-yellow); font-size: 2.2rem; margin-bottom: 1rem;">Waiting for Host to Start...</h2>
            <div id="projectorContent" style="font-size: 1.5rem; line-height: 1.4;">
                <!-- Dynamically populated IDLE / LOBBY view -->
            </div>
        </div>
    </div>

    <!-- BIG SCREEN ADVERT OVERLAY -->
    <div id="screenAdOverlay" class="hidden" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(5,10,20,0.96); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 3rem; text-align: center;">
        <h1 style="color: var(--neon-yellow); font-size: 3rem; margin-bottom: 1.5rem;">📢 FEATURED SPONSOR & ANNOUNCEMENT</h1>
        <p id="screenAdText" style="font-size: 2rem; color: white; max-width: 900px; margin-bottom: 2rem; line-height: 1.4;"></p>
        <div id="screenAdImageContainer"></div>
    </div>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let qrInitialized = false;

        socket.on('state-update', (state) => {
            if (state.welcomeHeader) document.getElementById('welcomeHeaderDisplay').innerText = state.welcomeHeader;
            if (state.venueDetails) document.getElementById('venueDetailsDisplay').innerText = state.venueDetails;

            // Handle Screen Ad Broadcast Overlay
            const screenAdOverlay = document.getElementById('screenAdOverlay');
            if (state.activeScreenAdvert) {
                screenAdOverlay.classList.remove('hidden');
                document.getElementById('screenAdText').innerText = state.activeScreenAdvert.text || '';
                const imgBox = document.getElementById('screenAdImageContainer');
                if (state.activeScreenAdvert.image) {
                    imgBox.innerHTML = `<img src="${state.activeScreenAdvert.image}" style="max-width: 700px; max-height: 450px; border-radius: 12px; border: 3px solid var(--neon-blue);">`;
                } else {
                    imgBox.innerHTML = '';
                }
            } else {
                screenAdOverlay.classList.add('hidden');
            }

            const title = document.getElementById('projectorTitle');
            const content = document.getElementById('projectorContent');

            if (state.status === 'QUESTION' && state.playlist[state.currentRoundIndex]) {
                qrInitialized = false;
                const round = state.playlist[state.currentRoundIndex];
                const q = round.questions[state.currentQuestionIndex];
                if (q) {
                    title.innerText = `Question ${state.currentQuestionIndex + 1} (${state.timer}s)`;
                    content.innerHTML = `
                        <p style="margin-bottom: 1.5rem; font-weight: bold; font-size: 1.8rem;">${q.question}</p>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; text-align: left;">
                            ${q.options.map((opt, idx) => `<div style="background: rgba(0,243,255,0.1); padding: 1.2rem; border-radius: 10px; border: 1px solid var(--neon-blue); font-size: 1.5rem;">${['A','B','C','D'][idx]}. ${opt}</div>`).join('')}
                        </div>
                    `;
                }
            } else if (state.status === 'INTERMISSION') {
                qrInitialized = false;
                title.innerText = '☕ Round Complete!';
                content.innerHTML = '<p style="font-size: 1.8rem; color: var(--text-muted);">Check your mobile screens for current standings. Next round starting soon!</p>';
            } else if (state.status === 'LEADERBOARD') {
                qrInitialized = false;
                title.innerText = '🏆 Final Leaderboard';
                const scores = Object.values(state.scores || {}).sort((a,b) => b.score - a.score);
                content.innerHTML = `
                    <div style="max-height: 400px; overflow-y: auto; text-align: left; width: 100%;">
                        ${scores.slice(0, 10).map((p, idx) => `
                            <div style="display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 1.5rem;">
                                <span>#${idx + 1} ${p.name}</span>
                                <span style="color: var(--neon-green);">${p.score} pts</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                // IDLE / LOBBY SCREEN (Show QR, Fact, Poll)
                title.innerText = '📱 Scan to Join & Play!';
                
                let factHTML = '';
                if (state.lobbySettings && state.lobbySettings.showFact && state.lobbySettings.factText) {
                    factHTML = `<div style="margin-top: 1.2rem; background: rgba(0,243,255,0.08); border: 1px solid rgba(0,243,255,0.3); padding: 1rem; border-radius: 10px; font-size: 1.2rem; color: var(--neon-blue);">💡 ${state.lobbySettings.factText}</div>`;
                }

                let pollHTML = '';
                if (state.lobbySettings && state.lobbySettings.showPoll && state.lobbySettings.pollQuestion) {
                    pollHTML = `
                        <div style="margin-top: 1rem; background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 10px; text-align: left;">
                            <strong style="color: var(--neon-yellow); font-size: 1.2rem; display: block; margin-bottom: 0.5rem;">📊 Practice Poll: ${state.lobbySettings.pollQuestion}</strong>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 1rem; color: var(--text-muted);">
                                ${state.lobbySettings.pollOptions.map(opt => `<div style="background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px;">• ${opt}</div>`).join('')}
                            </div>
                        </div>
                    `;
                }

                content.innerHTML = `
                    <div style="display: flex; gap: 2rem; align-items: center; justify-content: center;">
                        <div style="background: white; padding: 15px; border-radius: 12px; display: inline-block;">
                            <div id="projectorQR"></div>
                        </div>
                        <div style="text-align: left; max-width: 500px;">
                            <p style="font-size: 1.4rem; color: white; margin-bottom: 0.5rem;">1. Point your phone camera at the QR code.</p>
                            <p style="font-size: 1.4rem; color: white; margin-bottom: 0.5rem;">2. Enter your team name and join the arena.</p>
                            <p id="projectorJoinUrl" style="color: var(--neon-yellow); font-size: 1rem; word-break: break-all; margin-top: 0.5rem;"></p>
                        </div>
                    </div>
                    ${factHTML}
                    ${pollHTML}
                `;

                // Render QR code once if not already rendered
                const playerUrl = window.location.origin + '/player.html';
                document.getElementById('projectorJoinUrl').innerText = playerUrl;
                const qrContainer = document.getElementById('projectorQR');
                if (qrContainer && qrContainer.innerHTML.trim() === '') {
                    new QRCode(qrContainer, {
                        text: playerUrl,
                        width: 180,
                        height: 180,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            }
        });
    </script>
    <!-- Include QR code library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
