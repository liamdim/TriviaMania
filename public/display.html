<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaMania // Projector Display</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --neon-yellow: #f39c12;
            --text-muted: #aaaaaa;
            --neon-blue: #00d2ff;
            --bg-dark: #0b0f19;
            --card-bg: #131b2e;
        }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2.5rem;
            background: var(--card-bg);
            border-bottom: 2px solid rgba(255,255,255,0.05);
        }
        h1 { margin: 0; font-size: 1.8rem; color: var(--neon-yellow); }
        #projectorTimer { font-size: 1.5rem; font-weight: bold; color: var(--neon-blue); }
        #displayStage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="headerVenueTitle">TriviaMania</h1>
        <div id="projectorTimer">⏱️ --</div>
    </header>

    <div id="displayStage">
        <h2 style="font-size: 2.5rem; color: var(--neon-yellow); margin-bottom: 0.5rem;" id="displayWelcomeHeader">Welcome to TriviaMania!</h2>
        <p style="font-size: 1.3rem; color: var(--text-muted); margin-bottom: 1.5rem;" id="displayVenueDetails">Waiting for host to start...</p>
        <div id="projectorQrContainer" style="background: white; padding: 10px; border-radius: 8px; display: inline-block;"></div>
    </div>

    <div id="advertOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center; flex-direction:column; text-align:center; padding:2rem;">
        <h2 id="adOverlayTitle" style="font-size: 2.5rem; color: var(--neon-yellow); margin-bottom: 1rem;"></h2>
        <img id="adOverlayImage" style="max-width:70vw; max-height:60vh; border-radius:12px; display:none;" />
    </div>

    <script>
        const socket = io();

        console.log("Projector client script loaded.");

        socket.on('connect', () => {
            console.log("Projector connected successfully!");
        });

        socket.on('timer-tick', (timeLeft) => {
            const timerEl = document.getElementById('projectorTimer');
            if (timerEl) timerEl.innerText = '⏱️ ' + timeLeft + 's';
        });

        socket.on('state-update', (state) => {
            // Safely update venue details if element exists
            const venueEl = document.getElementById('displayVenueDetails');
            if (venueEl && state.venueDetails) venueEl.innerText = state.venueDetails;
            
            // Safely update headers if elements exist
            const headerEl = document.getElementById('headerVenueTitle');
            if (headerEl && state.welcomeHeader) headerEl.innerText = state.welcomeHeader;

            const welH = document.getElementById('displayWelcomeHeader');
            if (welH && state.welcomeHeader) welH.innerText = state.welcomeHeader;

            // Real-time Projector Advert Toggle
            const adOverlay = document.getElementById('advertOverlay');
            if (adOverlay) {
                if (state.activeScreenAdvert) {
                    adOverlay.style.display = 'flex';
                    const adTitle = document.getElementById('adOverlayTitle');
                    if (adTitle) adTitle.innerText = state.activeScreenAdvert.title || '';
                    
                    const img = document.getElementById('adOverlayImage');
                    if (img) {
                        if (state.activeScreenAdvert.image) {
                            img.src = state.activeScreenAdvert.image;
                            img.style.display = 'block';
                        } else {
                            img.style.display = 'none';
                        }
                    }
                } else {
                    adOverlay.style.display = 'none';
                }
            }

            // Handle IDLE / PAUSED stages safely with QR code generation
            const stage = document.getElementById('displayStage');
            if (stage && (state.status === 'IDLE' || state.status === 'PAUSED')) {
                const timerEl2 = document.getElementById('projectorTimer');
                if (timerEl2) timerEl2.innerText = '⏱️ --';

                if (!document.getElementById('projectorQrContainer') && state.welcomeHeader) {
                    stage.innerHTML = 
                        `<h2 style="font-size: 2.5rem; color: var(--neon-yellow); margin-bottom: 0.5rem;" id="displayWelcomeHeader">${state.welcomeHeader}</h2>` +
                        `<p style="font-size: 1.3rem; color: var(--text-muted); margin-bottom: 1.5rem;" id="displayVenueDetails">${state.venueDetails || ''}</p>` +
                        `<div id="projectorQrContainer" style="background: white; padding: 10px; border-radius: 8px; display: inline-block;"></div>` +
                        `<p id="projectorJoinUrlText" style="font-size: 1rem; color: var(--neon-blue); margin-top: 1rem; font-family: monospace;">Join at: ${window.location.origin}</p>`;
                }

                // Render QR code
                const qrEl = document.getElementById('projectorQrContainer');
                if (qrEl && window.QRCode && qrEl.childElementCount === 0) {
                    new QRCode(qrEl, {
                        text: window.location.origin,
                        width: 160,
                        height: 160,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            }
        });
    </script>
</body>
</html>
