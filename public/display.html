<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Projector Display</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --text: #ffffff;
            --text-muted: #8b9bb4;
            --border-glow: 0 0 25px rgba(0, 243, 255, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #05050a 70%); overflow: hidden; }

        header { display: flex; justify-content: space-between; align-items: center; background: rgba(10, 15, 30, 0.8); padding: 1rem 2rem; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: var(--border-glow); backdrop-filter: blur(10px); }
        header h1 { font-size: 2rem; color: var(--neon-blue); text-shadow: 0 0 15px rgba(0, 243, 255, 0.6); }
        #projectorTimer { font-size: 2.5rem; font-weight: bold; color: var(--neon-yellow); text-shadow: 0 0 15px rgba(255, 238, 0, 0.5); }

        .main-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; }
        .card { background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 16px; padding: 3rem; width: 100%; max-width: 900px; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 12px 40px rgba(0,0,0,0.6); }

        .question-text { font-size: 2.2rem; font-weight: bold; margin-bottom: 2rem; line-height: 1.4; color: var(--text); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; width: 100%; }
        .option-box { background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(0, 243, 255, 0.4); padding: 1.5rem; border-radius: 12px; font-size: 1.5rem; font-weight: 600; color: white; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }

        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .leaderboard-table th, .leaderboard-table td { padding: 1rem; font-size: 1.3rem; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .leaderboard-table th { color: var(--neon-blue); }

        #announcementBanner { background: linear-gradient(135deg, #aa7700, #ffee00); color: #000; padding: 1rem; border-radius: 10px; font-size: 1.3rem; font-weight: bold; margin-bottom: 1.5rem; display: none; width: 100%; max-width: 900px; box-shadow: 0 0 20px rgba(255, 238, 0, 0.5); }

        .floating-emoji { position: fixed; bottom: 50px; font-size: 4rem; animation: floatUp 2s ease-out forwards; pointer-events: none; z-index: 9999; }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-500px) scale(2); opacity: 0; }
        }

        #advertOverlay { position: fixed; inset: 0; background: rgba(5,5,10,0.95); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 3rem; text-align: center; }
    </style>
</head>
<body>

    <!-- Projector Audio Player for BeatIQ Music Snippets -->
    <audio id="displayAudioPlayer" preload="auto"></audio>

    <div id="advertOverlay">
        <h2 id="adOverlayTitle" style="font-size: 3rem; color: var(--neon-blue); margin-bottom: 2rem;"></h2>
        <img id="adOverlayImage" style="max-height: 60vh; max-width: 80vw; border-radius: 12px; box-shadow: 0 0 30px rgba(0,243,255,0.4); display: none;" />
    </div>

    <header>
        <h1 id="headerVenueTitle">TRIVIAMANIA</h1>
        <div id="projectorTimer">⏱ --</div>
    </header>

    <div class="main-stage">
        <div id="announcementBanner"></div>
        <div id="displayStage" class="card">
            <h2 style="font-size: 2.5rem; color: var(--neon-yellow);" id="displayWelcomeHeader">Welcome to TriviaMania!</h2>
            <p style="font-size: 1.3rem; color: var(--text-muted); margin-top: 1rem;" id="displayVenueDetails">Waiting for host to start game...</p>
        </div>
    </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            console.log("Projector display connected to server successfully!");
        });

        socket.on('stop-audio', () => {
            const audio = document.getElementById('displayAudioPlayer');
            audio.pause();
            audio.currentTime = 0;
        });

        socket.on('player-emoji', (data) => {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = data.emoji;
            el.style.left = (10 + Math.random() * 80) + '%';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        });

        socket.on('announcement-update', (announcement) => {
            const banner = document.getElementById('announcementBanner');
            if (announcement.active && announcement.text) {
                banner.style.display = 'block';
                banner.innerText = '📢 ' + announcement.text;
            } else {
                banner.style.display = 'none';
            }
        });

        socket.on('timer-tick', (timeLeft) => {
            document.getElementById('projectorTimer').innerText = '⏱ ' + timeLeft + 's';
        });

        socket.on('state-update', (state) => {
            console.log("Projector received state-update. Active screen advert:", state.activeScreenAdvert);

            if (state.venueDetails) document.getElementById('displayVenueDetails').innerText = state.venueDetails;
            if (state.welcomeHeader) {
                document.getElementById('headerVenueTitle').innerText = state.welcomeHeader;
                document.getElementById('displayWelcomeHeader').innerText = state.welcomeHeader;
            }

            // Instant Projector Advert Toggle Check
            const adOverlay = document.getElementById('advertOverlay');
            if (state.activeScreenAdvert) {
                adOverlay.style.display = 'flex';
                document.getElementById('adOverlayTitle').innerText = state.activeScreenAdvert.title;
                const img = document.getElementById('adOverlayImage');
                if (state.activeScreenAdvert.image) {
                    img.src = state.activeScreenAdvert.image;
                    img.style.display = 'block';
                } else {
                    img.style.display = 'none';
                }
            } else {
                adOverlay.style.display = 'none';
            }

            const stage = document.getElementById('displayStage');

            if (state.status === 'IDLE' || state.status === 'PAUSED') {
                document.getElementById('projectorTimer').innerText = '⏱ --';
                stage.innerHTML = 
                    '<h2 style="font-size: 2.5rem; color: var(--neon-yellow); margin-bottom: 1rem;">' + (state.welcomeHeader || 'Welcome to TriviaMania!') + '</h2>' +
                    '<p style="font-size: 1.4rem; color: var(--text-muted);">' + (state.venueDetails || 'Scan QR code on mobile to join!') + '</p>';
            } else if (state.status === 'QUESTION') {
                const round = state.playlist[state.currentRoundIndex];
                const q = round ? round.questions[state.currentQuestionIndex] : null;

                if (round && q) {
                    if (q.audioPreviewUrl) {
                        const audio = document.getElementById('displayAudioPlayer');
                        if (audio.src !== q.audioPreviewUrl) {
                            audio.src = q.audioPreviewUrl;
                            audio.load();
                            audio.play().catch(e => console.log("Audio autoplay prevented:", e));
                        }
                    } else {
                        const audio = document.getElementById('displayAudioPlayer');
                        audio.pause();
                        audio.currentTime = 0;
                    }

                    stage.innerHTML = 
                        '<div style="font-size: 1.1rem; color: var(--neon-blue); margin-bottom: 1rem; text-transform: uppercase; font-weight: bold;">' + round.name + ' // Question ' + (state.currentQuestionIndex + 1) + ' of ' + round.questions.length + '</div>' +
                        '<div class="question-text">' + q.question + '</div>' +
                        '<div class="options-grid">' +
                            q.options.map(opt => '<div class="option-box">' + opt + '</div>').join('') +
                        '</div>';
                }
            } else if (state.status === 'LEADERBOARD') {
                document.getElementById('projectorTimer').innerText = '⏱ ☕';
                const audio = document.getElementById('displayAudioPlayer');
                audio.pause();

                const sortedPlayers = Object.values(state.scores || {}).sort((a, b) => b.score - a.score);
                stage.innerHTML = 
                    '<h2 style="color: var(--neon-blue); font-size: 2.2rem; margin-bottom: 1.5rem;">🏆 LIVE STANDINGS</h2>' +
                    '<table class="leaderboard-table">' +
                        '<thead><tr><th>Rank</th><th>Player Name</th><th>Streak</th><th>Score</th></tr></thead>' +
                        '<tbody>' +
                            (sortedPlayers.length === 0 ? '<tr><td colspan="4">No scores recorded yet</td></tr>' : 
                                sortedPlayers.map((p, idx) => '<tr><td>' + (idx+1) + '</td><td>' + p.name + '</td><td>🔥 x' + (p.streak || 0) + '</td><td><strong>' + p.score + '</strong></td></tr>').join('')) +
                        '</tbody>' +
                    '</table>';
            }
        });
    </script>
</body>
</html>
