<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Projector Display</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --text: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background-image: radial-gradient(circle at 50% 50%, #1a103c 0%, #05050a 80%); }
        .container { text-align: center; width: 90%; max-width: 1200px; padding: 2rem; }
        h1 { font-size: 3.5rem; color: var(--neon-blue); margin-bottom: 1rem; text-shadow: 0 0 20px rgba(0,243,255,0.5); }
        h2 { font-size: 2.2rem; color: var(--neon-green); margin-bottom: 2rem; }
        .timer-box { font-size: 5rem; font-weight: bold; color: var(--neon-yellow); text-shadow: 0 0 20px rgba(255,238,0,0.5); margin: 1rem 0; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
        .option-card { background: rgba(15, 23, 42, 0.8); border: 2px solid var(--neon-blue); padding: 1.5rem; border-radius: 12px; font-size: 1.8rem; font-weight: bold; box-shadow: 0 0 15px rgba(0,243,255,0.2); }
        table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; background: rgba(15,23,42,0.8); border-radius: 12px; overflow: hidden; }
        th, td { padding: 1.2rem; text-align: center; font-size: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(0,243,255,0.2); color: var(--neon-blue); }
        
        .lobby-layout { display: flex; align-items: center; justify-content: center; gap: 4rem; margin-top: 1rem; }
        .qr-box { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 0 25px rgba(255,255,255,0.2); display: inline-block; }
        
        .corner-qr { position: absolute; bottom: 30px; right: 30px; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 0 15px rgba(255,255,255,0.3); display: flex; flex-direction: column; align-items: center; }
        .corner-qr span { font-size: 0.8rem; color: #000; font-weight: bold; margin-top: 4px; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translateY(80vh) scale(1.3); }
            100% { transform: translateY(-10vh) scale(2.2); opacity: 0; }
        }
        .floating-emoji { position: absolute; font-size: 4rem; animation: floatUp 3s ease-out forwards; z-index: 998; user-select: none; pointer-events: none; }
        
        .lobby-extras { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; align-items: center; }
        .lobby-banner { background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.3); padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1.2rem; max-width: 800px; }
    </style>
</head>
<body>

    <div id="floatingEmojiContainer"></div>

    <div class="container" id="displayContainer">
        <h1 id="displayTitle">Welcome to TriviaMania!</h1>
        <h2 id="displaySubtitle">Get your phones ready to play!</h2>
        <div id="displayContent">
            <div class="lobby-layout">
                <div>
                    <p style="font-size: 1.8rem; margin-bottom: 1rem; color: var(--neon-blue);">Scan to join on your mobile phone:</p>
                    <p id="playerJoinUrl" style="font-family: monospace; color: var(--neon-yellow); font-size: 1.2rem; margin-bottom: 1rem;"></p>
                </div>
                <div class="qr-box" id="projectorMainQr"></div>
            </div>
            <div class="lobby-extras" id="lobbyExtrasContainer"></div>
        </div>
    </div>

    <!-- Projector Advert Overlay Modal -->
    <div id="adOverlayModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(5,5,10,0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center; padding:2rem; text-align:center;">
        <h2 style="color: #ffee00; font-size: 3rem; margin-bottom: 1.5rem; text-shadow: 0 0 20px rgba(255,238,0,0.5);">📢 SPONSOR MESSAGE</h2>
        <div id="adImageContainer"></div>
        <p id="adTextContainer" style="color: #ffffff; font-size: 2.2rem; font-weight: bold; max-width: 900px; line-height: 1.4;"></p>
        <div class="corner-qr">
            <div id="projectorCornerQr"></div>
            <span>SCAN TO JOIN</span>
        </div>
    </div>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        const playerUrl = window.location.origin + '/player.html';

        document.getElementById('playerJoinUrl').innerText = playerUrl;
        new QRCode(document.getElementById("projectorMainQr"), { text: playerUrl, width: 200, height: 200 });
        new QRCode(document.getElementById("projectorCornerQr"), { text: playerUrl, width: 90, height: 90 });

        socket.on('state-update', (state) => {
            const titleEl = document.getElementById('displayTitle');
            const subtitleEl = document.getElementById('displaySubtitle');
            const contentEl = document.getElementById('displayContent');

            if (state.activeScreenAdvert) {
                showProjectorAdvert(state.activeScreenAdvert);
            } else {
                hideProjectorAdvert();
            }

            if (state.status === 'IDLE' || state.status === 'PAUSED') {
                titleEl.innerText = state.welcomeHeader || 'Welcome to TriviaMania!';
                subtitleEl.innerText = state.venueDetails || 'Get your phones ready to play!';
                
                let extrasHtml = '';
                if (state.lobbySettings) {
                    if (state.lobbySettings.showFact && state.lobbySettings.factText) {
                        extrasHtml += `<div class="lobby-banner" style="border-color: var(--neon-yellow); color: var(--neon-yellow);">💡 <strong>Trivia Fact:</strong> ${state.lobbySettings.factText}</div>`;
                    }
                    if (state.lobbySettings.showPoll && state.lobbySettings.pollQuestion) {
                        extrasHtml += `<div class="lobby-banner" style="border-color: var(--neon-green);">📊 <strong>Practice Poll:</strong> ${state.lobbySettings.pollQuestion}</div>`;
                    }
                }

                contentEl.innerHTML = `
                    <div class="lobby-layout">
                        <div>
                            <p style="font-size: 1.5rem; margin-bottom: 0.75rem; color: var(--neon-blue);">Scan to join on your mobile phone:</p>
                            <p style="font-family: monospace; color: var(--neon-yellow); font-size: 1.1rem; margin-bottom: 1rem;">${playerUrl}</p>
                        </div>
                        <div class="qr-box" id="projectorMainQr"></div>
                    </div>
                    <div class="lobby-extras">${extrasHtml}</div>
                `;
                setTimeout(() => {
                    const qrEl = document.getElementById('projectorMainQr');
                    if (qrEl && qrEl.innerHTML === '') {
                        new QRCode(qrEl, { text: playerUrl, width: 200, height: 200 });
                    }
                }, 50);
            } else if (state.status === 'QUESTION') {
                const round = state.playlist[state.currentRoundIndex];
                const q = round && round.questions ? round.questions[state.currentQuestionIndex] : null;

                if (q) {
                    titleEl.innerText = round.name;
                    subtitleEl.innerText = `Question ${state.currentQuestionIndex + 1} of ${round.questions.length}`;
                    
                    let optionsHtml = '';
                    if (q.options && q.options.length > 0) {
                        optionsHtml = `
                            <div class="timer-box">${state.timer}s</div>
                            <div class="options-grid">
                                ${q.options.map(opt => `<div class="option-card">${opt}</div>`).join('')}
                            </div>
                        `;
                    } else {
                        optionsHtml = `<div class="timer-box">${state.timer}s</div>`;
                    }

                    contentEl.innerHTML = `
                        <div style="font-size: 2.2rem; font-weight: bold; margin-bottom: 1.5rem;">${q.question}</div>
                        ${optionsHtml}
                    `;
                }
            } else if (state.status === 'LEADERBOARD') {
                titleEl.innerText = '🏆 FINAL LEADERBOARD 🏆';
                subtitleEl.innerText = 'What an incredible game!';
                const sorted = Object.values(state.scores || {}).sort((a,b) => b.score - a.score);
                contentEl.innerHTML = `
                    <table>
                        <thead><tr><th>Rank</th><th>Player Name</th><th>Streak</th><th>Score</th></tr></thead>
                        <tbody>
                            ${sorted.length === 0 ? '<tr><td colspan="4">No scores recorded</td></tr>' : sorted.map((p, idx) => `
                                <tr>
                                    <td>#${idx + 1}</td>
                                    <td>${p.name}</td>
                                    <td>🔥 x${p.streak || 0}</td>
                                    <td><strong>${p.score}</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
        });

        // Trigger floating animation on projector
        socket.on('trigger-floating-emoji', (emoji) => {
            spawnFloatingEmoji(emoji);
        });

        function spawnFloatingEmoji(emoji) {
            const container = document.getElementById('floatingEmojiContainer');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emoji;
            el.style.left = Math.random() * 85 + 5 + 'vw';
            container.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        socket.on('broadcast-advert-screen', (ad) => { showProjectorAdvert(ad); });
        socket.on('hide-advert-screen', () => { hideProjectorAdvert(); });

        function showProjectorAdvert(ad) {
            const overlay = document.getElementById('adOverlayModal');
            document.getElementById('adImageContainer').innerHTML = ad.image ? `<img src="${ad.image}" style="max-height: 45vh; max-width: 80vw; border-radius: 12px; border: 2px solid #ffee00; box-shadow: 0 0 30px rgba(255,238,0,0.3); margin-bottom: 1.5rem; object-fit: contain;">` : '';
            document.getElementById('adTextContainer').innerText = ad.text;
            overlay.style.display = 'flex';
        }

        function hideProjectorAdvert() {
            document.getElementById('adOverlayModal').style.display = 'none';
        }
    </script>
</body>
</html>
