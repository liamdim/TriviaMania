<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TriviaMania - Projector Screen</title>
    <style>
        :root { 
            --bg: #090a10; --card: #131520; --primary: #9c27b0; --primary-glow: rgba(156, 39, 176, 0.4);
            --accent: #00e5ff; --accent-glow: rgba(0, 229, 255, 0.3); --text: #ffffff; --muted: #8a8d9f;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; box-sizing: border-box; text-align: center; overflow: hidden; }
        h1 { font-size: 42px; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); margin-bottom: 10px; }
        .card { background: var(--card); border: 2px solid #222538; border-radius: 20px; padding: 40px; width: 80%; max-width: 900px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); position: relative; }
        .question-text { font-size: 28px; font-weight: bold; margin-bottom: 30px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .option-box { background: #1a1d2d; border: 2px solid #333852; padding: 20px; border-radius: 12px; font-size: 20px; font-weight: bold; }
        .status-msg { font-size: 24px; color: var(--muted); }
        .timer-badge { position: absolute; top: 20px; right: 30px; background: var(--primary); padding: 8px 16px; border-radius: 10px; font-weight: bold; font-size: 18px; box-shadow: 0 0 10px var(--primary-glow); }
        
        #advertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 10, 16, 0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; }
        #advertOverlay h2 { font-size: 48px; color: var(--accent); margin-bottom: 20px; text-shadow: 0 0 20px var(--accent-glow); }
        #advertOverlay img { max-width: 600px; max-height: 500px; border-radius: 14px; border: 3px solid var(--accent); }
    </style>
</head>
<body>

    <h1 id="displayTitle">TriviaMania Live Event</h1>
    
    <div class="card" id="displayCard">
        <div class="status-msg" id="statusMessage">Waiting for host to load a round and start...</div>
    </div>

    <div id="advertOverlay">
        <h2 id="adTitle">Sponsor Advert</h2>
        <img id="adImage" src="" alt="Advert Graphic" style="display:none;">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentGameData = null;
        let latestPlayers = {};

        socket.on('gameStateUpdate', function(state) {
            currentGameData = state;
            renderState(state);
        });

        socket.on('updatePlayers', function(players) {
            latestPlayers = players;
        });

        socket.on('timerUpdate', function(timeLeft) {
            const badge = document.getElementById('timerBadge');
            if (badge && currentGameData && currentGameData.currentRound) {
                const qIndex = currentGameData.currentQuestionIndex || 0;
                const totalQ = currentGameData.currentRound.questions.length;
                badge.textContent = `Q ${qIndex + 1} / ${totalQ} | ⏱️ ${timeLeft}s`;
            }
        });

        socket.on('revealAnswer', function() {
            if (!currentGameData || !currentGameData.currentRound) return;
            const qIndex = currentGameData.currentQuestionIndex || 0;
            const currentQ = currentGameData.currentRound.questions[qIndex];
            if (!currentQ) return;

            const boxes = document.querySelectorAll('.option-box');
            boxes.forEach(box => {
                if (box.textContent.trim() === currentQ.a.trim()) {
                    box.style.background = '#00e676';
                    box.style.color = '#000';
                    box.style.borderColor = '#fff';
                }
            });
        });

        socket.on('advertUpdate', function(advert) {
            const overlay = document.getElementById('advertOverlay');
            const titleEl = document.getElementById('adTitle');
            const imgEl = document.getElementById('adImage');

            if (advert.active && (advert.target === 'both' || advert.target === 'projector')) {
                titleEl.textContent = advert.title;
                if (advert.image) {
                    imgEl.src = advert.image;
                    imgEl.style.display = 'block';
                } else {
                    imgEl.style.display = 'none';
                }
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        });

        socket.on('updateSettings', function(settings) {
            if (settings.eventTitle) {
                document.getElementById('displayTitle').textContent = settings.eventTitle;
            }
        });

        function renderState(state) {
            const card = document.getElementById('displayCard');
            
            if (!state.currentRound || !state.currentRound.questions) {
                card.innerHTML = '<div class="status-msg">Lobby open! Waiting for host to load a round...</div>';
                return;
            }

            const qIndex = state.currentQuestionIndex || 0;
            const questions = state.currentRound.questions;
            const currentQ = questions[qIndex];

            if (!currentQ || state.status === 'finished') {
                const sorted = Object.values(latestPlayers).sort((a, b) => b.score - a.score);
                let lbHtml = '<h2>🏆 Final Round Leaderboard</h2><div style="max-height:300px; overflow-y:auto;">';
                sorted.forEach((p, idx) => {
                    lbHtml += `<div class="option-box" style="margin-bottom:8px; display:flex; justify-content:space-between;"><span>${idx + 1}. ${p.avatar} ${p.name}</span><span style="color:var(--accent);">${p.score} pts</span></div>`;
                });
                lbHtml += '</div>';
                card.innerHTML = lbHtml;
                return;
            }

            let optionsHtml = '';
            currentQ.options.forEach(opt => {
                optionsHtml += `<div class="option-box">${opt}</div>`;
            });

            card.innerHTML = `
                <div class="timer-badge" id="timerBadge">Q ${qIndex + 1} / ${questions.length} | ⏱️ ${state.timer || 15}s</div>
                <div style="font-size: 14px; color: var(--accent); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">${state.currentRound.name}</div>
                <div class="question-text">${currentQ.q}</div>
                <div class="options-grid">${optionsHtml}</div>
            `;
        }
    </script>
</body>
</html>
