<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaMania // Projector Display</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --neon-yellow: #f39c12;
            --text-muted: #aaaaaa;
            --neon-blue: #00d2ff;
            --bg-dark: #0b0f19;
            --card-bg: #131b2e;
        }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2.5rem;
            background: var(--card-bg);
            border-bottom: 2px solid rgba(255,255,255,0.05);
        }
        h1 { margin: 0; font-size: 1.8rem; color: var(--neon-yellow); }
        #projectorTimer { font-size: 1.8rem; font-weight: bold; color: var(--neon-blue); }
        #displayStage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            text-align: center;
        }
        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
            margin-top: 2rem;
        }
        .option-card {
            background: rgba(19, 27, 46, 0.9);
            border: 2px solid rgba(0, 210, 255, 0.3);
            padding: 1.5rem;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #audioUnlockOverlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--neon-yellow);
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.6);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="audioUnlockOverlay" onclick="unlockAudio()">🔊 CLICK HERE TO ENABLE SOUND</div>

    <header>
        <h1 id="headerVenueTitle">TriviaMania</h1>
        <div id="projectorTimer">⏱️ --</div>
    </header>

    <div id="displayStage">
        <h2 style="font-size: 2.5rem; color: var(--neon-yellow); margin-bottom: 0.5rem;" id="displayWelcomeHeader">Welcome to TriviaMania!</h2>
        <p style="font-size: 1.3rem; color: var(--text-muted); margin-bottom: 1.5rem;" id="displayVenueDetails">Waiting for host to start...</p>
        <div id="projectorQrContainer" style="background: white; padding: 10px; border-radius: 8px; display: inline-block;"></div>
    </div>

    <script>
        const socket = io();
        let audioCtx = null;
        let musicInterval = null;

        function unlockAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                // Play test chord
                playSynthMelody();
                
                const overlay = document.getElementById('audioUnlockOverlay');
                if (overlay) overlay.style.display = 'none';
                console.log("Audio unlocked successfully!");
            } catch (e) {
                console.error("Audio unlock failed:", e);
            }
        }

        // Play a fun synthesizer melody for music rounds
        function playSynthMelody() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const notes = [440, 554.37, 659.25, 880, 783.99, 659.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.2));
                    
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + (idx * 0.2));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.2) + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + (idx * 0.2));
                    osc.stop(audioCtx.currentTime + (idx * 0.2) + 0.3);
                });
            } catch (e) {}
        }

        socket.on('timer-tick', (timeLeft) => {
            const timerEl = document.getElementById('projectorTimer');
            if (timerEl) timerEl.innerText = '⏱️ ' + timeLeft + 's';
        });

        socket.on('stop-audio', () => {
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
            }
        });

        socket.on('state-update', (state) => {
            const stage = document.getElementById('displayStage');
            if (!stage) return;

            const headerEl = document.getElementById('headerVenueTitle');
            if (headerEl && state.welcomeHeader) headerEl.innerText = state.welcomeHeader;

            if (state.status === 'IDLE' || state.status === 'PAUSED') {
                if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
                const timerEl2 = document.getElementById('projectorTimer');
                if (timerEl2) timerEl2.innerText = '⏱️ --';

                stage.innerHTML = 
                    `<h2 style="font-size: 2.5rem; color: var(--neon-yellow); margin-bottom: 0.5rem;" id="displayWelcomeHeader">${state.welcomeHeader || 'Welcome to TriviaMania'}</h2>` +
                    `<p style="font-size: 1.3rem; color: var(--text-muted); margin-bottom: 1.5rem;" id="displayVenueDetails">${state.venueDetails || ''}</p>` +
                    `<div id="projectorQrContainer" style="background: white; padding: 10px; border-radius: 8px; display: inline-block;"></div>` +
                    `<p style="font-size: 1rem; color: var(--neon-blue); margin-top: 1rem; font-family: monospace;">Join at: ${window.location.origin}</p>`;

                const qrEl = document.getElementById('projectorQrContainer');
                if (qrEl && window.QRCode && qrEl.childElementCount === 0) {
                    new QRCode(qrEl, {
                        text: window.location.origin + '/player.html',
                        width: 160,
                        height: 160,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            } else if (state.status === 'QUESTION') {
                const currentRound = state.playlist[state.currentRoundIndex];
                if (!currentRound || !currentRound.questions) return;
                const currentQ = currentRound.questions[state.currentQuestionIndex];
                if (!currentQ) return;

                // If it's a music round, play the synth melody when the question appears
                if (currentRound.genre && currentRound.genre.toLowerCase().includes('beatiq')) {
                    playSynthMelody();
                    // Loop the melody every few seconds while the question is active if desired
                    if (!musicInterval) {
                        musicInterval = setInterval(() => {
                            playSynthMelody();
                        }, 4000);
                    }
                } else {
                    if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
                }

                let optionsHtml = '';
                if (currentQ.options && currentQ.options.length > 0) {
                    optionsHtml = '<div class="option-grid">' + 
                        currentQ.options.map((opt, idx) => {
                            const letters = ['A', 'B', 'C', 'D'];
                            return `<div class="option-card"><strong>${letters[idx]}:</strong> ${opt}</div>`;
                        }).join('') + '</div>';
                }

                stage.innerHTML = `
                    <div style="font-size: 1.1rem; color: var(--neon-green); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem;">🎵 ${currentRound.name} (Q${state.currentQuestionIndex + 1}/${currentRound.questions.length})</div>
                    <h2 style="font-size: 2.2rem; color: #fff; margin-bottom: 1.5rem; max-width: 1000px;">${currentQ.question}</h2>
                    ${optionsHtml}
                `;
            } else if (state.status === 'LEADERBOARD') {
                if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
                stage.innerHTML = `
                    <h2 style="font-size: 3rem; color: var(--neon-yellow); margin-bottom: 1rem;">🏆 Final Leaderboard 🏆</h2>
                    <p style="font-size: 1.5rem; color: var(--text-muted);">Great game everyone! Check your devices for final standings.</p>
                `;
            }
        });
    </script>
</body>
</html>
