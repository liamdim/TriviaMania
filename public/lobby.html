<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Lobby & QR Customizer</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --neon-blue: #00f3ff;
            --neon-yellow: #ffee00;
            --neon-green: #00ff66;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #05050a 70%); }
        header { background: rgba(10, 15, 30, 0.9); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 243, 255, 0.3); }
        header h1 { font-size: 1.5rem; color: var(--neon-blue); }
        .nav-links { display: flex; gap: 0.75rem; }
        .nav-links a { color: var(--neon-blue); text-decoration: none; padding: 0.5rem 1rem; background: rgba(0, 243, 255, 0.1); border-radius: 6px; border: 1px solid rgba(0, 243, 255, 0.3); font-size: 0.9rem; }
        .container { flex: 1; padding: 2rem; max-width: 800px; width: 100%; margin: 0 auto; }
        .card { background: var(--panel-bg); border-radius: 12px; padding: 2rem; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); margin-bottom: 1.5rem; }
        .card h3 { margin-bottom: 1.5rem; color: var(--neon-blue); font-weight: 600; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        input[type="text"] { width: 100%; padding: 0.75rem; background: rgba(5, 10, 20, 0.8); border: 1px solid rgba(0, 243, 255, 0.3); color: white; border-radius: 6px; }
        .checkbox-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; font-weight: bold; color: var(--neon-yellow); cursor: pointer; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--neon-blue); cursor: pointer; }
        button { background: linear-gradient(135deg, #0077ff, #00f3ff); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { filter: brightness(1.2); }
        #qr-container { display: flex; justify-content: center; padding: 1rem; background: white; border-radius: 12px; width: fit-content; margin: 1rem auto; box-shadow: 0 0 25px rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <header>
        <h1>🌐 Lobby, QR & Pre-Game Studio</h1>
        <div class="nav-links">
            <a href="/index.html">⚡ Live Controls</a>
        </div>
    </header>
    <div class="container">
        <!-- LOBBY SETTINGS -->
        <div class="card">
            <h3>Customize Projector Lobby</h3>
            <div class="form-group">
                <label>Projector Welcome Header:</label>
                <input type="text" id="welcomeHeaderInput" placeholder="Welcome to TriviaMania!">
            </div>
            <div class="form-group">
                <label>Venue Details / Subtitle:</label>
                <input type="text" id="venueDetailsInput" placeholder="Get your phones ready to play!">
            </div>
            <p style="color: var(--text-muted); margin-top: 1rem; margin-bottom: 0.5rem; text-align:center;">Player Mobile Join QR Code:</p>
            <div id="qr-container"></div>
            <p id="playerJoinUrl" style="text-align:center; font-family: monospace; color: var(--neon-blue);"></p>
        </div>

        <!-- PRE-GAME ENTERTAINMENT TOOLKIT -->
        <div class="card" style="border-color: var(--neon-yellow);">
            <h3 style="color: var(--neon-yellow);">🎮 Pre-Game Lobby Interactive Tools</h3>
            
            <div class="form-group">
                <label class="checkbox-row">
                    <input type="checkbox" id="showFactToggle"> Show Random Trivia Fact / Venue Tip on Projector
                </label>
                <input type="text" id="factTextInput" placeholder="e.g., Did you know? The pub record score is 480 points!">
            </div>

            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin: 1.5rem 0;">

            <div class="form-group">
                <label class="checkbox-row" style="color: var(--neon-green);">
                    <input type="checkbox" id="showPollToggle"> Show Interactive Practice Poll on Mobile Phones
                </label>
                <input type="text" id="pollQuestionInput" placeholder="Poll Question...">
            </div>
            <div class="form-group">
                <label>Poll Options (comma separated):</label>
                <input type="text" id="pollOptionsInput" placeholder="Beer 🍺, Cocktail 🍸, Wine 🍷, Soft Drink 🥤">
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button onclick="saveLobbyToolkit()" style="background: linear-gradient(135deg, #aa7700, #ffee00); color: #000; flex:1;">💾 Save Toolkit Changes</button>
                <button onclick="socket.emit('trigger-new-poll')" style="background: linear-gradient(135deg, #00aa44, #00ff66); color: #000; flex:1;">🎲 Randomize New Poll Now</button>
            </div>
        </div>

        <!-- EMOJI EDITOR -->
        <div class="card">
            <h3>🎭 Live Emoji Reactions Editor</h3>
            <div class="form-group">
                <label>Custom Emojis (comma separated):</label>
                <input type="text" id="emojisInput" value="🔥, 🍻, 👏, 😂, 🎉, 💡">
            </div>
            <button onclick="saveEmojis()">Update Emojis Live</button>
        </div>
    </div>
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        const playerUrl = window.location.origin + '/player.html';
        document.getElementById('playerJoinUrl').innerText = playerUrl;
        new QRCode(document.getElementById("qr-container"), { text: playerUrl, width: 180, height: 180 });

        const headerInput = document.getElementById('welcomeHeaderInput');
        const venueInput = document.getElementById('venueDetailsInput');
        const showFactToggle = document.getElementById('showFactToggle');
        const factTextInput = document.getElementById('factTextInput');
        const showPollToggle = document.getElementById('showPollToggle');
        const pollQuestionInput = document.getElementById('pollQuestionInput');
        const pollOptionsInput = document.getElementById('pollOptionsInput');
        const emojisInput = document.getElementById('emojisInput');

        socket.on('state-update', (state) => {
            if (state.welcomeHeader && document.activeElement !== headerInput) headerInput.value = state.welcomeHeader;
            if (state.venueDetails && document.activeElement !== venueInput) venueInput.value = state.venueDetails;
            if (state.customEmojis && document.activeElement !== emojisInput) emojisInput.value = state.customEmojis.join(', ');
            
            if (state.lobbySettings) {
                if (document.activeElement !== showFactToggle) showFactToggle.checked = state.lobbySettings.showFact;
                if (document.activeElement !== factTextInput && state.lobbySettings.factText) factTextInput.value = state.lobbySettings.factText;
                if (document.activeElement !== showPollToggle) showPollToggle.checked = state.lobbySettings.showPoll;
                if (document.activeElement !== pollQuestionInput && state.lobbySettings.pollQuestion) pollQuestionInput.value = state.lobbySettings.pollQuestion;
                if (document.activeElement !== pollOptionsInput && state.lobbySettings.pollOptions) pollOptionsInput.value = state.lobbySettings.pollOptions.join(', ');
            }
        });

        headerInput.addEventListener('input', () => socket.emit('update-welcome-header', headerInput.value));
        venueInput.addEventListener('input', () => socket.emit('update-venue-details', venueInput.value));

        function saveLobbyToolkit() {
            const settings = {
                showFact: showFactToggle.checked,
                factText: factTextInput.value,
                showPoll: showPollToggle.checked,
                pollQuestion: pollQuestionInput.value,
                pollOptionsStr: pollOptionsInput.value
            };
            socket.emit('update-lobby-toolkit', settings);
            alert('Lobby toolkit settings updated successfully!');
        }

        function saveEmojis() {
            const emojis = emojisInput.value.split(',').map(e => e.trim()).filter(e => e.length > 0);
            socket.emit('update-emojis', emojis);
            alert('Emojis updated live!');
        }
    </script>
</body>
</html>
