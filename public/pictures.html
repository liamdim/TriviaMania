<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>TriviaMania - Picture Round Studio</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffee00;
            --neon-red: #ff0055;
            --text: #ffffff;
            --text-muted: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #05050a 70%); padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: rgba(10, 15, 30, 0.9); padding: 1rem 2rem; border-radius: 8px; border: 1px solid rgba(0, 243, 255, 0.3); }
        header h1 { color: var(--neon-blue); font-size: 1.5rem; }
        .container { max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .card { background: var(--panel-bg); border-radius: 12px; padding: 1.5rem; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        input[type="text"] { width: 100%; padding: 0.75rem; background: rgba(5, 10, 20, 0.9); border: 1px solid rgba(0, 243, 255, 0.4); color: white; border-radius: 6px; margin-bottom: 0.75rem; font-size: 1rem; }
        button { padding: 0.75rem 1.2rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        button:hover { filter: brightness(1.2); }
        .btn-green { background: linear-gradient(135deg, #00aa44, var(--neon-green)); color: #000; }
        .btn-blue { background: linear-gradient(135deg, #0077ff, var(--neon-blue)); color: white; }
        .btn-red { background: linear-gradient(135deg, #aa0033, var(--neon-red)); color: white; }
        .item-row { background: rgba(5,10,20,0.6); padding: 1rem; border-radius: 8px; border: 1px solid rgba(0,243,255,0.2); margin-bottom: 0.75rem; display: flex; gap: 1rem; align-items: center; }
    </style>
</head>
<body>
    <header>
        <h1>🖼️ Picture Round Studio (Fuzzy Text Match)</h1>
        <a href="/" style="color: var(--neon-blue); text-decoration: none; font-weight: bold;">← Back to Host Control</a>
    </header>

    <div class="container">
        <div class="card">
            <h3 style="color: var(--neon-blue); margin-bottom: 1rem;">Create Custom Picture Round</h3>
            <label style="color: var(--text-muted); display: block; margin-bottom: 0.3rem;">Round Name:</label>
            <input type="text" id="roundNameInput" value="Famous Faces Picture Round">

            <h4 style="color: var(--neon-yellow); margin: 1rem 0 0.5rem 0;">Add Picture Question:</h4>
            <input type="text" id="imageUrlInput" placeholder="Image URL (e.g. https://imgur.com/... or image link)">
            <input type="text" id="answerInput" placeholder="Correct Answer (Fuzzy matched automatically e.g. Arnold Schwarzenegger)">
            <button class="btn-blue" onclick="addPictureItem()">➕ Add to Picture Round</button>
        </div>

        <div class="card">
            <h3 style="color: var(--neon-blue); margin-bottom: 1rem;">Picture Round Queue (<span id="itemCount">0</span> items)</h3>
            <div id="itemsListContainer">
                <p style="color: var(--text-muted);">No picture questions added yet.</p>
            </div>
            <button class="btn-green" style="width: 100%; margin-top: 1rem;" onclick="sendToGameQueue()">🚀 Send Picture Round to Live Game</button>
        </div>
    </div>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let pictureQuestions = [];

        function addPictureItem() {
            const imgUrl = document.getElementById('imageUrlInput').value.trim();
            const ans = document.getElementById('answerInput').value.trim();

            if (!imgUrl || !ans) {
                alert('Please provide both an image link and a correct answer.');
                return;
            }

            pictureQuestions.push({
                question: `🖼️ PICTURE ROUND: Identify what or who is shown in the image below!\n[IMG:${imgUrl}]`,
                options: [], // Empty options means it triggers text input with fuzzy matching on players' phones!
                answer: ans,
                fastestPlayerId: null
            });

            document.getElementById('imageUrlInput').value = '';
            document.getElementById('answerInput').value = '';
            renderList();
        }

        function removeItem(index) {
            pictureQuestions.splice(index, 1);
            renderList();
        }

        function renderList() {
            document.getElementById('itemCount').innerText = pictureQuestions.length;
            const container = document.getElementById('itemsListContainer');
            if (pictureQuestions.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No picture questions added yet.</p>';
                return;
            }

            container.innerHTML = pictureQuestions.map((item, idx) => {
                const imgMatch = item.question.match(/\[IMG:(.*?)\]/);
                const url = imgMatch ? imgMatch[1] : '';
                return `
                    <div class="item-row">
                        <img src="${url}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--neon-blue);" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\'><rect width=\'60\' height=\'60\' fill=\'%23111\'/><text x=\'50%\' y=\'50%\' fill=\'%23888\' font-size=\'10\' text-anchor=\'middle\' dy=\'.3em\'>No Image</text></svg>'">
                        <div style="flex: 1;">
                            <p style="font-size: 0.9rem; color: var(--text-muted); word-break: break-all;">${url}</p>
                            <p style="color: var(--neon-green); font-weight: bold; margin-top: 0.2rem;">Answer: ${item.answer}</p>
                        </div>
                        <button class="btn-red" style="padding: 0.4rem 0.8rem;" onclick="removeItem(${idx})">❌</button>
                    </div>
                `;
            }).join('');
        }

        function sendToGameQueue() {
            if (pictureQuestions.length === 0) {
                alert('Add at least one picture item first!');
                return;
            }
            const roundName = document.getElementById('roundNameInput').value.trim() || 'Picture Round';
            socket.emit('add-custom-picture-round', {
                name: roundName,
                questions: pictureQuestions
            });
            alert('Picture Round successfully sent to the live game queue!');
            window.location.href = '/';
        }
    </script>
</body>
</html>
